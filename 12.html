<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>KOF | Home</title>
    
    <link rel="preconnect" href="https://script.google.com">
    <link rel="preconnect" href="https://script.googleusercontent.com">
    <link rel="preconnect" href="https://www.google.com">

    <style>
        :root {
            --gold: #d4af37;
            --gold-light: #f3d06b;
            --glass: rgba(20, 20, 25, 0.88);
            --gold-gradient: linear-gradient(135deg, #d4af37, #b8860b);
        }

        * {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        body, html {
            margin: 0;
            padding: 0;
            height: 100%;
            height: 100dvh;
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            color: white;
            overflow: hidden;
            background-color: #000;
        }

        /* --- VIDEO BACKGROUND --- */
        #bg-video {
            position: fixed;
            top: 50%;
            left: 50%;
            min-width: 100%;
            min-height: 100%;
            width: auto;
            height: auto;
            z-index: 0;
            transform: translate(-50%, -50%);
            object-fit: cover;
            filter: brightness(0.35);
        }

        /* --- MAIN CONTENT CONTAINER --- */
        #main-wrapper {
            position: fixed;
            inset: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 10;
            padding: 20px;
            transition: filter 0.4s ease, opacity 0.4s ease;
        }

        .container {
            background: var(--glass);
            backdrop-filter: blur(18px);
            -webkit-backdrop-filter: blur(18px);
            width: 100%;
            max-width: 390px;
            padding: 34px 28px;
            border-radius: 28px;
            border: 1px solid rgba(212, 175, 55, 0.35);
            text-align: center;
            box-shadow: 0 25px 60px rgba(0, 0, 0, 0.92);
        }

        h1 {
            color: var(--gold);
            text-transform: uppercase;
            letter-spacing: 4px;
            margin: 8px 0 5px 0;
            font-size: 1.85rem;
        }

        .tagline {
            font-size: 0.75rem;
            color: #ccc;
            margin-bottom: 22px;
            text-transform: uppercase;
            letter-spacing: 2.5px;
        }

        .social-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin: 22px 0;
        }

        .btn-link {
            padding: 13px 10px;
            background: rgba(255, 255, 255, 0.06);
            color: white;
            text-decoration: none;
            border-radius: 12px;
            text-align: center;
            font-size: 0.8rem;
            font-weight: 600;
            border: 1px solid rgba(255, 255, 255, 0.12);
            cursor: pointer;
            transition: all 0.25s ease;
        }

        .btn-link:hover, .btn-link:active {
            border-color: var(--gold);
            background: rgba(212, 175, 55, 0.15);
            color: var(--gold-light);
        }

        /* --- GOLD BOOKING BUTTON --- */
        .btn-gold {
            display: block;
            width: 100%;
            padding: 18px;
            background: var(--gold-gradient);
            border: none;
            border-radius: 14px;
            color: #000;
            font-weight: 800;
            font-size: 0.9rem;
            cursor: pointer;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            transition: transform 0.2s ease, box-shadow 0.2s ease;
            box-shadow: 0 8px 22px rgba(212, 175, 55, 0.28);
        }

        .btn-gold:active {
            transform: scale(0.98);
        }

        /* --- PERSISTENT IN-PAGE IFRAME VIEWER --- */
        #inframe-overlay {
            position: fixed;
            inset: 0;
            z-index: 100;
            background: rgba(0, 0, 0, 0.88);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 10px;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s ease;
        }

        #inframe-overlay.active {
            opacity: 1;
            pointer-events: auto;
        }

        .viewer-shell {
            width: 100%;
            height: 100%;
            max-width: 540px;
            max-height: 880px;
            background: #111115;
            border-radius: 22px;
            overflow: hidden;
            border: 2px solid var(--gold);
            display: flex;
            flex-direction: column;
            box-shadow: 0 25px 70px rgba(0, 0, 0, 0.95);
        }

        /* --- TOP NAVIGATION BAR INSIDE VIEWER --- */
        .viewer-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 10px 12px;
            background: #0b0b0e;
            border-bottom: 1px solid rgba(212, 175, 55, 0.3);
            gap: 8px;
        }

        .viewer-tabs {
            display: flex;
            gap: 6px;
            overflow-x: auto;
            scrollbar-width: none;
        }

        .viewer-tabs::-webkit-scrollbar {
            display: none;
        }

        .tab-btn {
            background: rgba(255, 255, 255, 0.07);
            color: #ddd;
            border: 1px solid rgba(255, 255, 255, 0.12);
            border-radius: 8px;
            padding: 6px 10px;
            font-size: 0.72rem;
            font-weight: 600;
            white-space: nowrap;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .tab-btn.active {
            background: var(--gold-gradient);
            color: #000;
            border-color: var(--gold);
            font-weight: 800;
        }

        .viewer-actions {
            display: flex;
            align-items: center;
            gap: 6px;
            flex-shrink: 0;
        }

        .icon-btn {
            background: #1a1a20;
            color: var(--gold);
            border: 1px solid rgba(212, 175, 55, 0.5);
            border-radius: 50%;
            width: 32px;
            height: 32px;
            font-size: 0.85rem;
            font-weight: bold;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s ease;
        }

        .icon-btn:hover:not(:disabled) {
            background: var(--gold);
            color: #000;
        }

        .icon-btn:disabled {
            opacity: 0.35;
            cursor: not-allowed;
        }

        .iframe-stage {
            position: relative;
            flex: 1;
            width: 100%;
            background: #fff;
        }

        iframe {
            width: 100%;
            height: 100%;
            border: none;
            display: block;
            background: #fff;
        }

        /* --- LOADING SPINNER --- */
        #frame-loader {
            position: absolute;
            inset: 0;
            background: #121216;
            color: var(--gold);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 12px;
            font-size: 0.8rem;
            letter-spacing: 1.5px;
            text-transform: uppercase;
            z-index: 5;
            transition: opacity 0.25s ease;
        }

        #frame-loader.hidden {
            opacity: 0;
            pointer-events: none;
        }

        .spinner {
            width: 34px;
            height: 34px;
            border: 3px solid rgba(212, 175, 55, 0.2);
            border-top-color: var(--gold);
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .blur-active {
            filter: blur(15px);
        }

        #audio-status {
            margin-top: 16px;
            font-size: 0.7rem;
            color: var(--gold);
            text-transform: uppercase;
            letter-spacing: 1px;
            cursor: pointer;
        }
    </style>
</head>
<body>

<video autoplay muted loop playsinline id="bg-video">
    <source src="AQN2AjNNAJA3M0mzqjxkbDvoQH0XgE_FQtu9Ualt919hCRz_T1_TRvKPmgowcj-he_VFEkQuaJrCmjwBgHSxPXhsrTz7ZRGi1sHMLDpnC5BSZw.mp4" type="video/mp4">
</video>

<div id="main-wrapper">
    <div class="container">
        <div style="font-size: 3.3rem; margin-bottom: 4px;">👑</div>
        <h1>King of Fadez</h1>
        <p class="tagline">The Standard of Dasmariñas</p>

        <div class="social-grid">
            <button type="button" class="btn-link" onclick="openInFrame('maps')">🗺️ Maps</button>
            <button type="button" class="btn-link" onclick="openInFrame('tiktok')">📱 TikTok</button>
            <button type="button" class="btn-link" onclick="openInFrame('fb')">📘 FB Page</button>
            <button type="button" class="btn-link" onclick="openInFrame('web')">🌐 Web</button>
        </div>

        <button type="button" onclick="openInFrame('main', true)" class="btn-gold">Proceed to Booking</button>
        
        <div id="audio-status">🔊 Tap anywhere for sound</div>
    </div>
</div>

<!-- PERSISTENT IN-FRAME VIEWER (ALWAYS ON PAGE / ZERO DNS EXIT / ZERO REDIRECTS) -->
<div id="inframe-overlay" aria-hidden="true">
    <div class="viewer-shell">
        <div class="viewer-header">
            <div class="viewer-tabs">
                <button type="button" class="tab-btn active" data-tab="main" onclick="openInFrame('main', true)">✂️ Main</button>
                <button type="button" class="tab-btn" data-tab="maps" onclick="openInFrame('maps')">🗺️ Maps</button>
                <button type="button" class="tab-btn" data-tab="tiktok" onclick="openInFrame('tiktok')">📱 TikTok</button>
                <button type="button" class="tab-btn" data-tab="fb" onclick="openInFrame('fb')">📘 FB</button>
                <button type="button" class="tab-btn" data-tab="web" onclick="openInFrame('web')">🌐 Web</button>
            </div>
            <div class="viewer-actions">
                <button type="button" id="back-frame-btn" class="icon-btn" title="Previous sub-page" onclick="goBackInFrame()" disabled>←</button>
                <button type="button" class="icon-btn" title="Reload frame" onclick="reloadFrame()">↻</button>
                <button type="button" class="icon-btn" title="Back to Home" onclick="closeInFrame()">✕</button>
            </div>
        </div>

        <div class="iframe-stage">
            <div id="frame-loader">
                <div class="spinner"></div>
                <span>Loading Inside KOF...</span>
            </div>
            <!--
                STRICT ANTI-ESCAPE SANDBOX:
                - Allows scripts, same-origin, forms, modals, and downloads inside the iframe.
                - Blocks top-level navigation (`allow-top-navigation` omitted) so sub-buttons NEVER exit your DNS.
                - Blocks external tab popups (`allow-popups` omitted) so sub-buttons NEVER open outside tabs.
            -->
            <iframe 
                id="app-frame" 
                src="about:blank"
                sandbox="allow-scripts allow-same-origin allow-forms allow-modals allow-downloads"
                referrerpolicy="no-referrer-when-downgrade"
                allow="geolocation; payment; clipboard-write"
                loading="eager">
            </iframe>
        </div>
    </div>
</div>

<script>
const MAIN_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbyTLkCi-QOaJ4fUuD-gbj2_7-JD1kkTpLUbJYsUrThMw4NKzY1Ojsle-6Z0-_QN9GE9/exec";

const ROUTES = {
    main: MAIN_SCRIPT_URL,
    maps: "https://www.google.com/maps?q=King+Of+Fadez+Dasmariñas&output=embed",
    tiktok: "https://www.tiktok.com/embed/@kingoffadez.ph",
    fb: "https://www.facebook.com/plugins/post.php?href=https%3A%2F%2Fwww.facebook.com%2Fshare%2Fr%2F1NQfs6Fcer%2F&show_text=true&width=500",
    web: "https://kingoffadezph.com/"
};

const video = document.getElementById('bg-video');
const overlay = document.getElementById('inframe-overlay');
const wrapper = document.getElementById('main-wrapper');
const iframe = document.getElementById('app-frame');
const loader = document.getElementById('frame-loader');
const backBtn = document.getElementById('back-frame-btn');

let activeUrl = "";
let frameHistory = [];

// Resolves route names, full URLs, or sub-page query strings (?branch=...) into a valid in-frame URL
function resolveTargetUrl(routeOrUrl) {
    if (!routeOrUrl) return "";
    if (ROUTES[routeOrUrl]) return ROUTES[routeOrUrl];
    if (routeOrUrl.startsWith("?")) return `${MAIN_SCRIPT_URL}${routeOrUrl}`;
    if (routeOrUrl.startsWith("branch=")) return `${MAIN_SCRIPT_URL}?${routeOrUrl}`;
    return routeOrUrl;
}

function updateBackButton() {
    backBtn.disabled = frameHistory.length <= 1;
}

// Opens any main page or sub-landing page strictly inside the iframe
function openInFrame(routeOrUrl, forceReload = false, skipHistoryPush = false) {
    const resolvedUrl = resolveTargetUrl(routeOrUrl);
    if (!resolvedUrl) return;

    const isScriptUrl = resolvedUrl.startsWith(MAIN_SCRIPT_URL) || resolvedUrl.includes("script.google.com/macros/");
    const activeTab = ROUTES[routeOrUrl] ? routeOrUrl : (isScriptUrl ? 'main' : '');

    overlay.classList.add('active');
    overlay.setAttribute('aria-hidden', 'false');
    wrapper.classList.add('blur-active');

    document.querySelectorAll('.tab-btn').forEach(btn => {
        btn.classList.toggle('active', btn.dataset.tab === activeTab);
    });

    if (forceReload || activeUrl !== resolvedUrl || iframe.src === 'about:blank') {
        if (!skipHistoryPush && activeUrl !== resolvedUrl) {
            frameHistory.push(resolvedUrl);
        }
        activeUrl = resolvedUrl;
        loader.classList.remove('hidden');
        iframe.src = resolvedUrl;
        updateBackButton();
    }

    syncParentDnsUrl(resolvedUrl);
}

// Navigate backwards between sub-pages inside the frame
function goBackInFrame() {
    if (frameHistory.length <= 1) return;
    frameHistory.pop();
    const previousUrl = frameHistory[frameHistory.length - 1];
    updateBackButton();
    openInFrame(previousUrl, true, true);
}

// Mirrors sub-page query parameters (e.g., ?branch=kof19a7) onto your own DNS URL without redirecting
function syncParentDnsUrl(targetUrl) {
    try {
        const parsed = new URL(targetUrl);
        if (targetUrl.includes("script.google.com/macros/")) {
            const nextParentUrl = `${window.location.pathname}${parsed.search}`;
            window.history.replaceState({ inframeUrl: targetUrl }, "", nextParentUrl);
        }
    } catch (_) {}
}

function reloadFrame() {
    if (!activeUrl) return;
    loader.classList.remove('hidden');
    iframe.src = activeUrl;
}

function closeInFrame() {
    overlay.classList.remove('active');
    overlay.setAttribute('aria-hidden', 'true');
    wrapper.classList.remove('blur-active');
    window.history.replaceState({}, "", window.location.pathname);
}

iframe.addEventListener('load', () => {
    loader.classList.add('hidden');
});

// Auto-handle direct sub-landing URLs on your DNS (e.g., yourdomain.com/?branch=kof19a7 or #kof19a7)
window.addEventListener('DOMContentLoaded', () => {
    const params = new URLSearchParams(window.location.search);
    const hashValue = window.location.hash.replace(/^#/, '').trim();

    if (params.toString()) {
        openInFrame(`${MAIN_SCRIPT_URL}?${params.toString()}`, true);
        return;
    }

    if (hashValue) {
        const query = hashValue.includes('=') ? hashValue : `branch=${encodeURIComponent(hashValue)}`;
        openInFrame(`${MAIN_SCRIPT_URL}?${query}`, true);
        return;
    }

    // Preload main Apps Script silently in background so booking opens immediately
    setTimeout(() => {
        if (!activeUrl) {
            activeUrl = MAIN_SCRIPT_URL;
            frameHistory = [MAIN_SCRIPT_URL];
            iframe.src = MAIN_SCRIPT_URL;
            updateBackButton();
        }
    }, 600);
});

// Intercept any <a> link clicks on the outer page so nothing ever exits your DNS
document.addEventListener('click', (e) => {
    const anchor = e.target.closest('a[href]');
    if (!anchor) return;

    const href = anchor.getAttribute('href');
    if (!href || href.startsWith('javascript:')) return;

    e.preventDefault();
    openInFrame(anchor.href, true);
}, true);

// Block window.open() from escaping outside the page
window.open = function(url) {
    if (url) openInFrame(url, true);
    return null;
};

// Listen for postMessage navigation events from sub-buttons inside the embedded frame
window.addEventListener('message', (event) => {
    const data = event.data;
    if (!data) return;

    if (typeof data === 'string') {
        if (data.startsWith('http') || data.startsWith('?') || data.startsWith('branch=')) {
            openInFrame(data, true);
        }
    } else if (typeof data === 'object') {
        const target = data.url || data.href || data.src;
        if (target) {
            openInFrame(target, true);
        } else if (data.branch) {
            openInFrame(`${MAIN_SCRIPT_URL}?branch=${encodeURIComponent(data.branch)}`, true);
        }
    }
});

// Tap anywhere to unmute background video
document.body.addEventListener('click', function() {
    if (video.muted) {
        video.muted = false;
        video.play().catch(() => {});
        const audioLabel = document.getElementById('audio-status');
        if (audioLabel) audioLabel.style.display = 'none';
    }
}, { once: true });
</script>

</body>
</html>
