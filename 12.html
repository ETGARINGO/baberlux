<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <link rel="icon" type="image/png" href="SHOP_BRANDING.jpg">
  <link rel="apple-touch-icon" href="SHOP_BRANDING.jpg">
  <title>KOF | Booking App</title>
  
  <!-- Performance Hints -->
  <link rel="preconnect" href="https://script.google.com">
  <link rel="dns-prefetch" href="https://script.google.com">

  <style>
    :root {
      --gold: #d4af37;
      --glass: rgba(10, 10, 10, 0.55);
      --gold-gradient: linear-gradient(135deg, #d4af37, #b8860b);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      width: 100%;
      height: 100%;
      font-family: 'Segoe UI', Roboto, Arial, sans-serif;
      background: #050505;
      color: #fff;
      overflow: hidden;
    }

    /* BACKGROUND VIDEO */
    #bg-video {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      filter: brightness(0.55) contrast(1.1);
      z-index: 0;
    }

    /* MAIN OVERLAY */
    #overlay {
      position: fixed;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      z-index: 2;
      overflow-y: auto;
    }

    /* GLASS CARD */
    .card {
      width: 100%;
      max-width: 380px;
      padding: 35px 25px;
      background: var(--glass);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border-radius: 28px;
      border: 1px solid rgba(212, 175, 55, 0.35);
      text-align: center;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.9);
    }

    .crown-icon {
      font-size: 3.5rem;
      filter: drop-shadow(0 0 12px rgba(212, 175, 55, 0.6));
      line-height: 1;
    }

    h1 {
      color: var(--gold);
      letter-spacing: 4px;
      margin: 12px 0 5px;
      font-size: 1.75rem;
      text-transform: uppercase;
      font-weight: 900;
    }

    .tagline {
      font-size: 0.72rem;
      letter-spacing: 2.5px;
      margin-bottom: 24px;
      opacity: 0.9;
      color: #e0e0e0;
    }

    .detail {
      text-align: left;
      font-size: 0.85rem;
      margin-bottom: 16px;
      line-height: 1.45;
      background: rgba(0, 0, 0, 0.35);
      padding: 12px 14px;
      border-radius: 12px;
      border: 1px solid rgba(255, 255, 255, 0.06);
    }

    .detail strong {
      display: block;
      color: var(--gold);
      font-size: 0.65rem;
      letter-spacing: 1.5px;
      margin-bottom: 4px;
    }

    .socials {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin: 22px 0;
    }

    .link-btn {
      padding: 13px;
      border-radius: 12px;
      background: rgba(0, 0, 0, 0.55);
      border: 1px solid rgba(255, 255, 255, 0.12);
      color: #fff;
      font-size: 0.8rem;
      font-weight: 600;
      text-decoration: none;
      transition: background 0.2s, border-color 0.2s;
    }

    .link-btn:hover {
      background: rgba(212, 175, 55, 0.15);
      border-color: var(--gold);
    }

    .book-btn {
      display: block;
      width: 100%;
      padding: 18px;
      border-radius: 16px;
      background: var(--gold-gradient);
      color: #000;
      font-size: 0.9rem;
      font-weight: 900;
      letter-spacing: 1px;
      text-transform: uppercase;
      text-decoration: none;
      box-shadow: 0 6px 20px rgba(212, 175, 55, 0.4);
      transition: transform 0.2s, box-shadow 0.2s;
    }

    .book-btn:active {
      transform: scale(0.98);
    }

    #audio-hint {
      margin-top: 16px;
      font-size: 0.7rem;
      color: var(--gold);
      font-weight: 700;
      letter-spacing: 0.5px;
      animation: pulse 2s infinite;
      cursor: pointer;
    }

    @keyframes pulse {
      0%, 100% { opacity: 0.5; }
      50% { opacity: 1; }
    }

    /* BOOKING MODAL */
    #booking {
      position: fixed;
      inset: 0;
      background: #080808;
      z-index: 9999;
      display: none;
      flex-direction: column;
      transform: translateY(100%);
      opacity: 0;
      transition: transform 0.4s cubic-bezier(0.4, 0, 0.2, 1), opacity 0.4s ease;
    }

    #booking.active {
      display: flex;
      transform: translateY(0);
      opacity: 1;
    }

    .booking-header {
      height: 60px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 18px;
      color: var(--gold);
      border-bottom: 1px solid rgba(212, 175, 55, 0.35);
      background: #0a0a0a;
      font-weight: 800;
      font-size: 0.9rem;
      letter-spacing: 1.5px;
      text-transform: uppercase;
    }

    .header-actions {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .fallback-link {
      font-size: 0.7rem;
      color: #000;
      background: var(--gold);
      padding: 7px 12px;
      border-radius: 8px;
      text-decoration: none;
      font-weight: 800;
      letter-spacing: 0.5px;
    }

    #closeBooking {
      background: rgba(255, 255, 255, 0.08);
      border: none;
      color: #fff;
      width: 36px;
      height: 36px;
      border-radius: 10px;
      font-size: 1.2rem;
      cursor: pointer;
      display: grid;
      place-items: center;
    }

    #booking iframe {
      width: 100%;
      height: calc(100% - 60px);
      border: none;
      background: #fff;
    }
  </style>
</head>
<body>

  <!-- VIDEO BACKGROUND -->
  <video id="bg-video" autoplay muted loop playsinline preload="metadata">
    <source src="IMG_1039.MOV" type="video/mp4">
    <source src="IMG_1039.MOV" type="video/quicktime">
  </video>

  <!-- MAIN CARD -->
  <div id="overlay">
    <div class="card">
      <div class="crown-icon">👑</div>
      <h1>King of Fadez</h1>
      <div class="tagline">THE STANDARD OF DASMARIÑAS</div>

      <div class="detail">
        <strong>📍 LOCATION</strong>
        Blk 4, Lot 18 Congressional Ave, Brgy San Miguel II, Dasmariñas, Cavite
      </div>

      <div class="detail">
        <strong>📧 CONTACT</strong>
        Kingoffadezph@gmail.com
      </div>

      <div class="socials">
        <a class="link-btn" href="https://maps.google.com/?q=King+of+Fadez+Dasmariñas" target="_blank" rel="noopener">🗺️ Maps</a>
        <a class="link-btn" href="https://www.tiktok.com/@kingoffadez.ph" target="_blank" rel="noopener">📱 TikTok</a>
        <a class="link-btn" href="https://www.facebook.com/share/r/1NQfs6Fcer/" target="_blank" rel="noopener">📘 FB Page</a>
        <a class="link-btn" href="http://Kingoffadezph.com/" target="_blank" rel="noopener">🌐 Web</a>
      </div>

      <a href="#" class="book-btn" id="openBooking">Proceed to Booking</a>
      <div id="audio-hint">🔊 Tap anywhere to enable sound</div>
    </div>
  </div>

  <!-- BOOKING MODAL -->
  <div id="booking">
    <div class="booking-header">
      <span>Secure Booking</span>
      <div class="header-actions">
        <a class="fallback-link" href="https://script.google.com/macros/s/AKfycbyBHs5chxyOcId3CqxQOkeUPAeF5SeBluT0naSKqFmPsFtJ98ctlAL5tqXcINQ57SPa/exec?branch=main" target="_blank" rel="noopener">↗ Open Direct</a>
        <button id="closeBooking" aria-label="Close Booking">✕</button>
      </div>
    </div>

    <!-- UNRESTRICTED IFRAME FOR GOOGLE APPS SCRIPT -->
    <iframe
      id="bookingFrame"
      src="https://script.google.com/macros/s/AKfycbyBHs5chxyOcId3CqxQOkeUPAeF5SeBluT0naSKqFmPsFtJ98ctlAL5tqXcINQ57SPa/exec?branch=main"
      allow="camera; microphone; clipboard-read; clipboard-write; geolocation"
      referrerpolicy="no-referrer-when-downgrade">
    </iframe>
  </div>

  <script>
    const video = document.getElementById('bg-video');
    const hint = document.getElementById('audio-hint');
    const booking = document.getElementById('booking');

    // Enable video audio on first user interaction
    document.body.addEventListener('click', () => {
      if (video.muted) {
        video.muted = false;
        video.play().catch(() => {});
        hint.style.display = 'none';
      }
    }, { once: true });

    // Open Booking Modal
    document.getElementById('openBooking').addEventListener('click', (e) => {
      e.preventDefault();
      booking.style.display = 'flex';
      requestAnimationFrame(() => booking.classList.add('active'));
    });

    // Close Booking Modal
    document.getElementById('closeBooking').addEventListener('click', () => {
      booking.classList.remove('active');
      setTimeout(() => {
        booking.style.display = 'none';
      }, 400);
    });
  </script>

</body>
</html>
