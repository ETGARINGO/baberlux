
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#080808">
<meta name="robots" content="noindex,nofollow">
<title>KING OF FADEZ | Direct Terminal</title>

<style>
:root{
 --black:#050505;
 --gold:#d4af37;
 --gold-dark:#98701c;
 --gold-light:#f9e6a1;
 --glass:rgba(10,10,10,.86);
 --line:rgba(212,175,55,.3);
 --red:#ff6262;
}

*{box-sizing:border-box}

html,body{
 width:100%;height:100%;
 margin:0;overflow:hidden;
 background:var(--black);
 color:white;
 font-family:Inter,"Segoe UI",Arial,sans-serif;
 overscroll-behavior:none;
}

button{font:inherit;cursor:pointer}

#background{
 position:fixed;inset:0;z-index:0;
 background:
 radial-gradient(ellipse at 50% 35%,#392b12 0%,transparent 55%),
 linear-gradient(145deg,#151109,#030303);
}

#bg-video{
 position:fixed;inset:0;
 width:100%;height:100%;
 object-fit:cover;
 opacity:.28;
 filter:brightness(.45);
 pointer-events:none;
}

#ambient{
 position:fixed;inset:0;z-index:1;
 pointer-events:none;
 background:linear-gradient(180deg,#0005,#000c);
}

#particles{
 position:fixed;inset:0;
 z-index:2;pointer-events:none;
 overflow:hidden;
}

.particle{
 position:absolute;
 width:3px;height:3px;
 border-radius:50%;
 background:var(--gold);
 box-shadow:0 0 12px var(--gold);
 opacity:0;
 animation:rise linear infinite;
}

@keyframes rise{
 0%{transform:translateY(20px);opacity:0}
 15%{opacity:.6}
 85%{opacity:.35}
 100%{transform:translateY(-110vh) translateX(35px);opacity:0}
}

@keyframes spin{
 to{transform:rotate(360deg)}
}

@keyframes pulse{
 0%,100%{box-shadow:0 0 12px #d4af3722}
 50%{box-shadow:0 0 30px #d4af3766}
}

@keyframes fadeIn{
 from{opacity:0;transform:translateY(12px)}
 to{opacity:1;transform:translateY(0)}
}

@keyframes shimmer{
 0%{background-position:-200%}
 100%{background-position:200%}
}

/* HEADER */

#header{
 position:fixed;top:0;left:0;right:0;
 height:62px;z-index:20;
 display:flex;align-items:center;
 justify-content:space-between;
 padding:0 20px;
 background:rgba(5,5,5,.78);
 backdrop-filter:blur(18px);
 border-bottom:1px solid var(--line);
}

.brand{
 display:flex;align-items:center;gap:11px;
}

.brand-icon{
 width:36px;height:36px;
 display:grid;place-items:center;
 border-radius:10px;
 color:#080808;
 font-size:22px;
 background:linear-gradient(145deg,#f5dc82,#98701c);
}

.brand-title{
 color:var(--gold);
 font-size:12px;
 font-weight:950;
 letter-spacing:3px;
}

.brand-sub{
 color:#999;
 font-size:8px;
 letter-spacing:1.5px;
 margin-top:4px;
}

.connection{
 display:flex;align-items:center;gap:8px;
 font-size:9px;letter-spacing:1.5px;
 color:#aaa;
}

.dot{
 width:7px;height:7px;
 background:#35dc91;
 border-radius:50%;
 box-shadow:0 0 10px #35dc91;
}

/* APPLICATION */

#app-container{
 position:fixed;
 top:62px;left:0;right:0;bottom:0;
 z-index:5;background:#fff;
}

#app-frame{
 display:block;
 width:100%;height:100%;
 border:0;background:white;
}

/* FLOATING CONTROL */

#controls{
 position:fixed;
 top:75px;right:14px;
 z-index:30;
 display:flex;gap:7px;
 padding:7px;
 border:1px solid var(--line);
 border-radius:30px;
 background:rgba(5,5,5,.88);
 backdrop-filter:blur(15px);
 box-shadow:0 5px 20px #0008;
 transition:opacity .3s;
}

.control{
 border:0;border-radius:25px;
 padding:10px 14px;
 font-size:9px;font-weight:900;
 letter-spacing:1px;
 color:var(--gold-light);
 background:#ffffff12;
}

.control.gold{
 background:linear-gradient(110deg,#98701c,#f4d979,#b68a26);
 background-size:200%;
 color:#080808;
 animation:shimmer 5s linear infinite;
}

.control:active{transform:scale(.95)}

/* LOADING SCREEN */

#loading{
 position:fixed;inset:0;
 z-index:15;
 display:flex;
 align-items:center;
 justify-content:center;
 flex-direction:column;
 text-align:center;
 padding:25px;
 background:
 radial-gradient(ellipse at 50% 40%,#251d0e,#050505 65%);
 transition:opacity .5s,visibility .5s;
}

#loading.done{
 opacity:0;visibility:hidden;
 pointer-events:none;
}

.loader{
 width:52px;height:52px;
 border:3px solid #ffffff15;
 border-top-color:var(--gold);
 border-right-color:var(--gold-light);
 border-radius:50%;
 animation:spin .8s linear infinite;
 margin-bottom:25px;
}

.loading-crown{
 font-size:35px;
 color:var(--gold);
 margin-bottom:12px;
}

#loading h1{
 font-size:17px;
 color:var(--gold);
 letter-spacing:4px;
 margin:0 0 10px;
}

#loading p{
 color:#999;
 font-size:10px;
 line-height:1.8;
 letter-spacing:1px;
 max-width:320px;
}

.loading-status{
 color:#d4af37;
 font-size:9px;
 letter-spacing:2px;
 margin-top:22px;
}

.loading-line{
 width:180px;height:2px;
 background:#ffffff15;
 overflow:hidden;
 margin-top:12px;
 border-radius:10px;
}

.loading-line:after{
 content:"";
 display:block;
 height:100%;width:40%;
 background:var(--gold);
 animation:progress 1.5s ease-in-out infinite;
}

@keyframes progress{
 from{transform:translateX(-100%)}
 to{transform:translateX(350%)}
}

/* ERROR / RETRY PANEL */

#connection-error{
 display:none;
 position:fixed;inset:0;
 z-index:18;
 align-items:center;
 justify-content:center;
 padding:20px;
 background:#080808f5;
}

.error-card{
 width:100%;max-width:370px;
 padding:28px;
 border:1px solid var(--line);
 border-radius:20px;
 background:#12110d;
 text-align:center;
 animation:fadeIn .4s ease;
}

.error-card h2{
 color:var(--gold);
 font-size:16px;
 letter-spacing:2px;
}

.error-card p{
 font-size:11px;
 color:#aaa;
 line-height:1.8;
}

.error-actions{
 display:flex;gap:10px;
 margin-top:20px;
}

.error-actions button{
 flex:1;padding:13px 8px;
 border-radius:9px;border:0;
 font-size:10px;font-weight:900;
}

.retry{
 background:var(--gold);
 color:#080808;
}

.dismiss{
 background:#282828;color:white;
}

/* FOOTER */

#footer{
 position:fixed;
 bottom:0;left:0;right:0;
 z-index:10;
 height:22px;
 pointer-events:none;
 background:linear-gradient(transparent,#0008);
}

/* MOBILE */

@media(max-width:600px){
 #header{height:55px;padding:0 12px}
 .brand-title{font-size:10px;letter-spacing:2px}
 .brand-sub{font-size:7px}
 .brand-icon{width:32px;height:32px}
 .connection{font-size:8px}
 #app-container{top:55px}
 #controls{
  top:auto;right:10px;bottom:28px;
 }
 .control{padding:11px 13px}
}

@media(prefers-reduced-motion:reduce){
 *,*::before,*::after{
  animation-duration:.01ms!important;
  transition-duration:.01ms!important;
 }
}
</style>
</head>

<body>

<div id="background"></div>

<video id="bg-video" autoplay muted loop playsinline>
 <source src="IMG_1039.MOV" type="video/quicktime">
 <source src="IMG_1039.MOV" type="video/mp4">
</video>

<div id="ambient"></div>
<div id="particles"></div>

<!-- HEADER -->
<header id="header">
 <div class="brand">
  <div class="brand-icon">♛</div>
  <div>
   <div class="brand-title">KING OF FADEZ</div>
   <div class="brand-sub">MANAGEMENT TERMINAL</div>
  </div>
 </div>

 <div class="connection">
  <span class="dot"></span>
  <span id="network-status">CONNECTING</span>
 </div>
</header>

<!-- DIRECT APPLICATION -->
<main id="app-container">
 <iframe
  id="app-frame"
  title="King of Fadez Management Application"
  src="about:blank"
  allow="fullscreen; clipboard-read; clipboard-write"
  allowfullscreen
  referrerpolicy="strict-origin-when-cross-origin">
 </iframe>
</main>

<!-- FLOATING CONTROLS -->
<div id="controls">
 <button class="control" onclick="refreshApp()">↻ REFRESH</button>
 <button class="control gold" onclick="toggleControls()">♛ KOF</button>
</div>

<!-- LOADING -->
<section id="loading">
 <div class="loading-crown">♛</div>
 <div class="loader"></div>
 <h1>KING OF FADEZ</h1>
 <p>INITIALIZING MANAGEMENT SYSTEM</p>
 <div class="loading-status" id="loading-status">
  ESTABLISHING CONNECTION...
 </div>
 <div class="loading-line"></div>
</section>

<!-- CONNECTION WARNING -->
<section id="connection-error">
 <div class="error-card">
  <div style="font-size:35px">⚠️</div>
  <h2>CONNECTION DELAY</h2>
  <p id="error-message">
   The application is taking longer than expected.
   It may be processing a redirect or loading external resources.
  </p>
  <div class="error-actions">
   <button class="retry" onclick="refreshApp()">RETRY</button>
   <button class="dismiss" onclick="hideError()">CONTINUE WAITING</button>
  </div>
 </div>
</section>

<div id="footer"></div>

<script>
"use strict";

/* =========================================
   KOF DIRECT OPEN CONFIGURATION
========================================= */

// Use the latest application URL supplied
// in your uploaded HTML.

const APP_URL =
 "https://script.google.com/macros/s/AKfycbwN1heg3YsO0MjPt58M7H_QBbnnR6fjxMTMhahHzjMdLimwo2ZfCjGby_mHlPGBvBGI/exec";

// Automatic loading timeout.
// This is only a warning, not an iframe error detector.
const WARNING_DELAY = 20000;

const frame = document.getElementById("app-frame");
const loading = document.getElementById("loading");
const errorPanel = document.getElementById("connection-error");
const statusText = document.getElementById("network-status");
const loadingStatus = document.getElementById("loading-status");

let warningTimer = null;
let loadTimer = null;
let loaded = false;
let controlsVisible = true;

/* =========================================
   PARTICLES
========================================= */

(function initParticles(){

 const container = document.getElementById("particles");

 for(let i=0;i<22;i++){

  const particle = document.createElement("div");

  particle.className = "particle";

  particle.style.left =
   Math.random()*100+"%";

  particle.style.bottom =
   Math.random()*-20+"vh";

  particle.style.animationDuration =
   (8+Math.random()*12)+"s";

  particle.style.animationDelay =
   Math.random()*10+"s";

  container.appendChild(particle);
 }

})();

/* =========================================
   AUTOMATIC DIRECT OPEN
========================================= */

function directOpen(){

 loaded = false;

 clearTimeout(warningTimer);
 clearTimeout(loadTimer);

 loading.classList.remove("done");

 errorPanel.style.display = "none";

 loadingStatus.textContent =
  "CONNECTING TO MANAGEMENT SERVER...";

 statusText.textContent = "CONNECTING";

 // Directly load the application in the iframe.
 // No login, no launch screen, no new browser tab.

 frame.src = APP_URL;

 // Show a warning if loading takes too long.
 warningTimer = setTimeout(()=>{

  if(!loaded){

   loadingStatus.textContent =
    "WAITING FOR APPLICATION RESPONSE...";

   errorPanel.style.display = "flex";

  }

 },WARNING_DELAY);

}

/* =========================================
   IFRAME LOAD EVENT
========================================= */

frame.addEventListener("load",()=>{

 // An iframe load event does not guarantee
 // the remote app rendered successfully.
 loaded = true;

 clearTimeout(warningTimer);
 clearTimeout(loadTimer);

 loading.classList.add("done");

 errorPanel.style.display = "none";

 statusText.textContent =
  navigator.onLine ? "SYSTEM CONNECTED" : "OFFLINE";

});

/* =========================================
   REFRESH
========================================= */

function refreshApp(){

 errorPanel.style.display = "none";

 loading.classList.remove("done");

 loadingStatus.textContent =
  "RECONNECTING TO SYSTEM...";

 statusText.textContent = "RECONNECTING";

 // Reopen the same URL inside the same iframe.
 frame.src = "about:blank";

 clearTimeout(loadTimer);

 loadTimer = setTimeout(()=>{
  frame.src = APP_URL;
 },100);

 loaded = false;

 clearTimeout(warningTimer);

 warningTimer = setTimeout(()=>{

  if(!loaded){
   errorPanel.style.display = "flex";
  }

 },WARNING_DELAY+100);

}

/* =========================================
   CONTINUE WAITING
========================================= */

function hideError(){

 errorPanel.style.display = "none";

 loadingStatus.textContent =
  "STILL CONNECTING...";

}

/* =========================================
   MINIMAL FLOATING CONTROLS
========================================= */

function toggleControls(){

 controlsVisible = !controlsVisible;

 document.getElementById("controls").style.opacity =
  controlsVisible ? "1" : ".18";

 document.getElementById("controls").style.transform =
  controlsVisible ? "scale(1)" : "scale(.85)";

}

/* =========================================
   NETWORK STATUS
========================================= */

window.addEventListener("online",()=>{

 statusText.textContent = "NETWORK ONLINE";

});

window.addEventListener("offline",()=>{

 statusText.textContent = "NETWORK OFFLINE";

 loadingStatus.textContent =
  "CHECK YOUR INTERNET CONNECTION";

});

/* =========================================
   INITIALIZE
========================================= */

document.addEventListener("DOMContentLoaded",()=>{

 directOpen();

});

</script>

</body>
</html>
