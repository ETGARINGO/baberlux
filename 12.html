<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#080808">
  <meta name="robots" content="noindex,nofollow">
  <title>KING OF FADEZ | Management System</title>
  <style>
    :root {
      --bg: #050505;
      --gold: #d4af37;
      --gold-dark: #a67c00;
      --gold-light: #f9e6a1;
      --white: #ffffff;
      --muted: #999999;
      --line: rgba(212, 175, 55, 0.25);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      width: 100%;
      height: 100%;
      background: var(--bg);
      color: var(--white);
      font-family: 'Inter', 'Segoe UI', Arial, sans-serif;
      overflow: hidden;
      overscroll-behavior: none;
    }

    button {
      font: inherit;
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
    }

    /* BACKGROUND LAYERS */
    .bg-fallback {
      position: fixed;
      inset: 0;
      z-index: 0;
      background: 
        radial-gradient(ellipse at 50% 30%, #332710 0%, transparent 55%),
        linear-gradient(145deg, #17130a, #030303 75%);
    }

    #bg-video {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      z-index: 1;
      filter: brightness(0.35) saturate(0.7);
    }

    #ambient {
      position: fixed;
      inset: 0;
      z-index: 2;
      pointer-events: none;
      background: linear-gradient(180deg, rgba(0, 0, 0, 0.3), rgba(0, 0, 0, 0.8));
    }

    #particles {
      position: fixed;
      inset: 0;
      z-index: 3;
      pointer-events: none;
      overflow: hidden;
    }

    .particle {
      position: absolute;
      width: 3px;
      height: 3px;
      border-radius: 50%;
      background: var(--gold);
      opacity: 0;
      box-shadow: 0 0 12px var(--gold);
      animation: floatUp linear infinite;
    }

    /* ANIMATIONS */
    @keyframes floatUp {
      0% { transform: translateY(20px); opacity: 0; }
      15% { opacity: 0.6; }
      85% { opacity: 0.4; }
      100% { transform: translateY(-110vh) translateX(35px); opacity: 0; }
    }

    @keyframes goldPulse {
      0%, 100% { box-shadow: 0 0 15px rgba(212, 175, 55, 0.15); }
      50% { box-shadow: 0 0 30px rgba(212, 175, 55, 0.45); }
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(15px) scale(0.98); }
      to { opacity: 1; transform: translateY(0) scale(1); }
    }

    @keyframes crownFloat {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-6px); }
    }

    @keyframes shimmer {
      0% { background-position: -200% 0; }
      100% { background-position: 200% 0; }
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    /* TOP HEADER */
    .brand {
      position: fixed;
      top: 22px;
      left: 25px;
      z-index: 20;
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .brand-icon {
      width: 40px;
      height: 40px;
      border-radius: 12px;
      display: grid;
      place-items: center;
      background: linear-gradient(145deg, #f5dc82, #98701c);
      color: #080808;
      font-size: 21px;
      box-shadow: 0 0 20px rgba(212, 175, 55, 0.25);
    }

    .brand-name {
      font-size: 13px;
      font-weight: 900;
      letter-spacing: 3px;
      color: var(--gold);
    }

    .brand-sub {
      font-size: 9px;
      letter-spacing: 2px;
      color: #aaaaaa;
      margin-top: 3px;
    }

    .status {
      position: fixed;
      top: 28px;
      right: 25px;
      z-index: 20;
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 9px;
      letter-spacing: 2px;
      color: #cccccc;
    }

    .status-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: #36d98a;
      box-shadow: 0 0 10px #36d98a;
    }

    /* PORTAL GATEWAY */
    #portal {
      position: fixed;
      inset: 0;
      z-index: 10;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      transition: opacity 0.4s ease, visibility 0.4s ease;
    }

    #portal.hidden {
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
    }

    .portal-card {
      width: 100%;
      max-width: 410px;
      padding: 40px 30px 32px;
      border: 1px solid var(--line);
      border-radius: 25px;
      background: linear-gradient(145deg, rgba(25, 23, 17, 0.92), rgba(5, 5, 5, 0.96));
      backdrop-filter: blur(22px);
      -webkit-backdrop-filter: blur(22px);
      text-align: center;
      box-shadow: 0 25px 80px rgba(0, 0, 0, 0.85);
      animation: fadeIn 0.7s ease, goldPulse 5s infinite;
    }

    .crown {
      font-size: 48px;
      color: var(--gold);
      filter: drop-shadow(0 0 12px rgba(212, 175, 55, 0.4));
      animation: crownFloat 3s ease-in-out infinite;
    }

    .portal-card h1 {
      color: var(--gold);
      letter-spacing: 4px;
      font-size: 26px;
      margin: 12px 0 6px;
      font-weight: 900;
    }

    .tagline {
      font-size: 10px;
      color: #aaaaaa;
      letter-spacing: 4px;
    }

    .location {
      font-size: 10px;
      color: var(--gold-light);
      letter-spacing: 2.5px;
      margin: 22px 0 25px;
    }

    .action-group {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .btn {
      width: 100%;
      padding: 16px;
      border-radius: 12px;
      border: 1px solid transparent;
      font-size: 11px;
      font-weight: 900;
      letter-spacing: 1.5px;
      transition: transform 0.2s, box-shadow 0.2s, background 0.2s;
    }

    .btn:active {
      transform: scale(0.97);
    }

    .btn-gold {
      color: #090909;
      background: linear-gradient(110deg, #98701c, #f4d979, #b68a26);
      background-size: 200% 100%;
      animation: shimmer 5s linear infinite;
    }

    .btn-gold:hover {
      box-shadow: 0 5px 25px rgba(212, 175, 55, 0.45);
    }

    .btn-outline {
      color: var(--gold-light);
      border-color: #5b4b25;
      background: rgba(212, 175, 55, 0.055);
    }

    .btn-outline:hover {
      background: rgba(212, 175, 55, 0.15);
      border-color: var(--gold);
    }

    .divider {
      height: 1px;
      background: rgba(255, 255, 255, 0.1);
      margin: 22px 0 16px;
    }

    .footer-note {
      font-size: 9px;
      color: #777777;
      letter-spacing: 1.5px;
      line-height: 1.6;
    }

    /* APP WORKSPACE */
    #workspace {
      position: fixed;
      inset: 0;
      z-index: 30;
      background: #050505;
      display: none;
      opacity: 0;
      transition: opacity 0.4s ease;
    }

    #workspace.active {
      display: block;
      opacity: 1;
    }

    #app-frame {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      border: 0;
      background: #ffffff;
    }

    /* FLOATING TOOLBAR */
    #toolbar {
      position: absolute;
      top: 14px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 50;
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 6px 10px;
      border: 1px solid rgba(212, 175, 55, 0.3);
      border-radius: 50px;
      background: rgba(8, 8, 8, 0.9);
      backdrop-filter: blur(16px);
      box-shadow: 0 5px 25px rgba(0, 0, 0, 0.6);
    }

    .tool-btn {
      border: 0;
      border-radius: 30px;
      padding: 8px 14px;
      color: var(--gold-light);
      background: rgba(255, 255, 255, 0.06);
      font-size: 9px;
      font-weight: 800;
      letter-spacing: 1px;
      white-space: nowrap;
      transition: background 0.2s;
    }

    .tool-btn:hover {
      background: rgba(212, 175, 55, 0.2);
    }

    .tool-btn.admin {
      background: rgba(212, 175, 55, 0.2);
      color: var(--gold);
      border: 1px solid var(--gold);
    }

    .tool-btn.exit {
      background: #351313;
      color: #ff7777;
    }

    .tool-btn.exit:hover {
      background: #4d1919;
    }

    /* LOADING OVERLAY */
    #loading {
      position: absolute;
      inset: 0;
      z-index: 40;
      display: none;
      align-items: center;
      justify-content: center;
      flex-direction: column;
      background: #080808;
      color: var(--gold);
      text-align: center;
    }

    #loading.show {
      display: flex;
    }

    .loader {
      width: 42px;
      height: 42px;
      border: 3px solid rgba(255, 255, 255, 0.1);
      border-top-color: var(--gold);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin-bottom: 18px;
    }

    #loading h3 {
      font-size: 12px;
      letter-spacing: 3px;
      margin-bottom: 8px;
    }

    #loading p {
      color: #888888;
      font-size: 10px;
      letter-spacing: 1px;
    }

    /* MOBILE ADJUSTMENTS */
    @media (max-width: 600px) {
      .brand { top: 16px; left: 16px; }
      .status { top: 24px; right: 16px; font-size: 8px; }
      .portal-card { padding: 34px 22px 26px; }
      .portal-card h1 { font-size: 22px; }
      #toolbar {
        top: auto;
        bottom: 14px;
        width: calc(100% - 24px);
        justify-content: center;
        flex-wrap: wrap;
      }
      .tool-btn { padding: 8px 10px; font-size: 8px; }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation-duration: 0.01ms !important;
        transition-duration: 0.01ms !important;
      }
    }
  </style>
</head>
<body>

  <!-- AMBIENT BACKGROUND -->
  <div class="bg-fallback"></div>
  <video id="bg-video" autoplay muted loop playsinline>
    <source src="IMG_1039.MOV" type="video/quicktime">
    <source src="IMG_1039.MOV" type="video/mp4">
  </video>
  <div id="ambient"></div>
  <div id="particles"></div>

  <!-- HEADER -->
  <div class="brand">
    <div class="brand-icon">♛</div>
    <div>
      <div class="brand-name">KING OF FADEZ</div>
      <div class="brand-sub">PREMIUM MANAGEMENT SYSTEM</div>
    </div>
  </div>

  <div class="status">
    <span class="status-dot"></span>
    <span>SYSTEM ONLINE</span>
  </div>

  <!-- MAIN LANDING CARD -->
  <main id="portal">
    <div class="portal-card">
      <div class="crown">♛</div>
      <h1>KING OF FADEZ</h1>
      <div class="tagline">BARBERSHOP MANAGEMENT</div>
      <div class="location">DASMARIÑAS • CAVITE</div>

      <div class="action-group">
        <button class="btn btn-gold" onclick="launchInApp()">LAUNCH EMBEDDED VIEW</button>
        <button class="btn btn-outline" onclick="launchAdminTab()">ADMIN PORTAL</button>
        <button class="btn btn-outline" onclick="launchTab()">OPEN IN NEW TAB</button>
      </div>

      <div class="divider"></div>
      <div class="footer-note">AUTHORIZED BARBERSHOP OPERATIONS PORTAL</div>
    </div>
  </main>

  <!-- WORKSPACE CONTAINER -->
  <section id="workspace">
    <div id="toolbar">
      <button class="tool-btn" onclick="reloadApp()">↻ REFRESH</button>
      <button class="tool-btn admin" onclick="launchAdminTab()">🛡️ ADMIN</button>
      <button class="tool-btn" onclick="launchTab()">↗ OPEN TAB</button>
      <button class="tool-btn exit" onclick="closeApp()">✕ HOME</button>
    </div>

    <div id="loading">
      <div class="loader"></div>
      <h3>CONNECTING TO SYSTEM</h3>
      <p>Please wait while the workspace loads...</p>
    </div>

    <iframe id="app-frame" title="King of Fadez System" allow="clipboard-write"></iframe>
  </section>

  <script>
    const MAIN_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbyBHs5chxyOcId3CqxQOkeUPAeF5SeBluT0naSKqFmPsFtJ98ctlAL5tqXcINQ57SPa/exec?branch=main";
    const ADMIN_URL = "https://script.google.com/macros/s/AKfycbyBHs5chxyOcId3CqxQOkeUPAeF5SeBluT0naSKqFmPsFtJ98ctlAL5tqXcINQ57SPa/exec?bpage=dmin";

    const portal = document.getElementById('portal');
    const workspace = document.getElementById('workspace');
    const frame = document.getElementById('app-frame');
    const loading = document.getElementById('loading');

    // Generate ambient gold particles
    function initParticles() {
      const container = document.getElementById('particles');
      for (let i = 0; i < 22; i++) {
        const p = document.createElement('div');
        p.className = 'particle';
        p.style.left = Math.random() * 100 + 'vw';
        p.style.bottom = -(Math.random() * 20) + 'vh';
        p.style.animationDuration = (8 + Math.random() * 10) + 's';
        p.style.animationDelay = (Math.random() * 8) + 's';
        container.appendChild(p);
      }
    }

    function launchInApp() {
      portal.classList.add('hidden');
      workspace.classList.add('active');
      loading.classList.add('show');
      
      frame.src = MAIN_SCRIPT_URL;
      frame.onload = () => {
        loading.classList.remove('show');
      };
    }

    function launchTab() {
      window.open(MAIN_SCRIPT_URL, '_blank');
    }

    function launchAdminTab() {
      window.open(ADMIN_URL, '_blank');
    }

    function reloadApp() {
      loading.classList.add('show');
      frame.src = MAIN_SCRIPT_URL;
    }

    function closeApp() {
      workspace.classList.remove('active');
      portal.classList.remove('hidden');
      setTimeout(() => {
        frame.src = 'about:blank';
      }, 400);
    }

    initParticles();
  </script>
</body>
</html>
