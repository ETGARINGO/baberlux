<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>KOF | Home</title>
    
    <link rel="preconnect" href="https://script.google.com">
    <link rel="preconnect" href="https://www.google.com">

    <style>
        :root {
            --gold: #d4af37;
            --gold-light: #f3d06b;
            --glass: rgba(20, 20, 25, 0.88);
            --gold-gradient: linear-gradient(135deg, #d4af37, #b8860b);
        }

        * {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        body, html {
            margin: 0;
            padding: 0;
            height: 100%;
            height: 100dvh;
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            color: white;
            overflow: hidden;
            background-color: #000;
        }

        /* --- VIDEO BACKGROUND --- */
        #bg-video {
            position: fixed;
            top: 50%;
            left: 50%;
            min-width: 100%;
            min-height: 100%;
            width: auto;
            height: auto;
            z-index: 0;
            transform: translate(-50%, -50%);
            object-fit: cover;
            filter: brightness(0.35);
        }

        /* --- MAIN CONTENT CONTAINER --- */
        #main-wrapper {
            position: fixed;
            inset: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 10;
            padding: 20px;
            transition: filter 0.4s ease, opacity 0.4s ease;
        }

        .container {
            background: var(--glass);
            backdrop-filter: blur(18px);
            -webkit-backdrop-filter: blur(18px);
            width: 100%;
            max-width: 390px;
            padding: 32px 26px;
            border-radius: 28px;
            border: 1px solid rgba(212, 175, 55, 0.35);
            text-align: center;
            box-shadow: 0 25px 60px rgba(0, 0, 0, 0.92);
        }

        h1 {
            color: var(--gold);
            text-transform: uppercase;
            letter-spacing: 4px;
            margin: 8px 0 5px 0;
            font-size: 1.85rem;
        }

        .tagline {
            font-size: 0.75rem;
            color: #ccc;
            margin-bottom: 22px;
            text-transform: uppercase;
            letter-spacing: 2.5px;
        }

        .social-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin: 20px 0;
        }

        .btn-link {
            padding: 13px 10px;
            background: rgba(255, 255, 255, 0.06);
            color: white;
            text-decoration: none;
            border-radius: 12px;
            text-align: center;
            font-size: 0.8rem;
            font-weight: 600;
            border: 1px solid rgba(255, 255, 255, 0.12);
            cursor: pointer;
            transition: all 0.25s ease;
        }

        .btn-link:hover, .btn-link:active {
            border-color: var(--gold);
            background: rgba(212, 175, 55, 0.15);
            color: var(--gold-light);
        }

        /* --- GOLD BOOKING BUTTON --- */
        .btn-gold {
            display: block;
            width: 100%;
            padding: 17px;
            background: var(--gold-gradient);
            border: none;
            border-radius: 14px;
            color: #000;
            font-weight: 800;
            font-size: 0.9rem;
            cursor: pointer;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            transition: transform 0.2s ease, box-shadow 0.2s ease;
            box-shadow: 0 8px 22px rgba(212, 175, 55, 0.28);
            margin-bottom: 10px;
        }

        .btn-gold:active {
            transform: scale(0.98);
        }

        /* --- SUB-LANDING BRANCH BUTTON --- */
        .btn-sub {
            display: block;
            width: 100%;
            padding: 14px;
            background: rgba(212, 175, 55, 0.12);
            border: 1px solid rgba(212, 175, 55, 0.55);
            border-radius: 14px;
            color: var(--gold-light);
            font-weight: 700;
            font-size: 0.82rem;
            cursor: pointer;
            text-transform: uppercase;
            letter-spacing: 1.2px;
            transition: all 0.2s ease;
        }

        .btn-sub:hover, .btn-sub:active {
            background: rgba(212, 175, 55, 0.24);
            border-color: var(--gold);
        }

        /* --- PERSISTENT IN-PAGE IFRAME VIEWER --- */
        #inframe-overlay {
            position: fixed;
            inset: 0;
            z-index: 100;
            background: rgba(0, 0, 0, 0.88);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 10px;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s ease;
        }

        #inframe-overlay.active {
            opacity: 1;
            pointer-events: auto;
        }

        .viewer-shell {
            width: 100%;
            height: 100%;
            max-width: 540px;
            max-height: 880px;
            background: #111115;
            border-radius: 22px;
            overflow: hidden;
            border: 2px solid var(--gold);
            display: flex;
            flex-direction: column;
            box-shadow: 0 25px 70px rgba(0, 0, 0, 0.95);
        }

        /* Top Navigation Bar Inside Viewer */
        .viewer-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 10px 12px;
            background: #0b0b0e;
            border-bottom: 1px solid rgba(212, 175, 55, 0.3);
            gap: 8px;
        }

        .viewer-tabs {
            display: flex;
            gap: 6px;
            overflow-x: auto;
            scrollbar-width: none;
        }

        .viewer-tabs::-webkit-scrollbar {
            display: none;
        }

        .tab-btn {
            background: rgba(255, 255, 255, 0.07);
            color: #ddd;
            border: 1px solid rgba(255, 255, 255, 0.12);
            border-radius: 8px;
            padding: 6px 10px;
            font-size: 0.72rem;
            font-weight: 600;
            white-space: nowrap;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .tab-btn.active {
            background: var(--gold-gradient);
            color: #000;
            border-color: var(--gold);
            font-weight: 800;
        }

        .viewer-actions {
            display: flex;
            align-items: center;
            gap: 6px;
            flex-shrink: 0;
        }

        .icon-btn {
            background: #1a1a20;
            color: var(--gold);
            border: 1px solid rgba(212, 175, 55, 0.5);
            border-radius: 50%;
            width: 32px;
            height: 32px;
            font-size: 0.85rem;
            font-weight: bold;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .icon-btn:hover {
            background: var(--gold);
            color: #000;
        }

        .iframe-stage {
            position: relative;
            flex: 1;
            width: 100%;
            background: #fff;
        }

        iframe {
            width: 100%;
            height: 100%;
            border: none;
            display: block;
            background: #fff;
        }

        /* Loading Spinner */
        #frame-loader {
            position: absolute;
            inset: 0;
            background: #121216;
            color: var(--gold);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 12px;
            font-size: 0.8rem;
            letter-spacing: 1.5px;
            text-transform: uppercase;
            z-index: 5;
            transition: opacity 0.25s ease;
        }

        #frame-loader.hidden {
            opacity: 0;
            pointer-events: none;
        }

        .spinner {
            width: 34px;
            height: 34px;
            border: 3px solid rgba(212, 175, 55, 0.2);
            border-top-color: var(--gold);
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .blur-active {
            filter: blur(15px);
        }

        #audio-status {
            margin-top: 16px;
            font-size: 0.7rem;
            color: var(--gold);
            text-transform: uppercase;
            letter-spacing: 1px;
            cursor: pointer;
        }
    </style>
</head>
<body>

<video autoplay muted loop playsinline id="bg-video">
    <source src="AQN2AjNNAJA3M0mzqjxkbDvoQH0XgE_FQtu9Ualt919hCRz_T1_TRvKPmgowcj-he_VFEkQuaJrCmjwBgHSxPXhsrTz7ZRGi1sHMLDpnC5BSZw.mp4" type="video/mp4">
</video>

<div id="main-wrapper">
    <div class="container">
        <div style="font-size: 3.3rem; margin-bottom: 4px;">👑</div>
        <h1>King of Fadez</h1>
        <p class="tagline">The Standard of Dasmariñas</p>

        <div class="social-grid">
            <button type="button" class="btn-link" onclick="openInFrame('maps')">🗺️ Maps</button>
            <button type="button" class="btn-link" onclick="openInFrame('tiktok')">📱 TikTok</button>
            <button type="button" class="btn-link" onclick="openInFrame('fb')">📘 FB Page</button>
            <button type="button" class="btn-link" onclick="openInFrame('web')">🌐 Web</button>
        </div>

        <button type="button" onclick="openInFrame('booking')" class="btn-gold">Proceed to Booking</button>
        
        <!-- Sub-Landing Branch Button (Always Opens In-Frame, Never Exits DNS) -->
        <button type="button" onclick="openSubBranch('kof19a7')" class="btn-sub">📍 Book Branch: KOF 19A7</button>
        
        <div id="audio-status">🔊 Tap anywhere for sound</div>
    </div>
</div>

<!-- PERSISTENT IN-FRAME VIEWER (ZERO REDIRECTS / ZERO DNS EXIT) -->
<div id="inframe-overlay" aria-hidden="true">
    <div class="viewer-shell">
        <div class="viewer-header">
            <div class="viewer-tabs">
                <button type="button" class="tab-btn active" data-tab="booking" onclick="openInFrame('booking')">✂️ Main</button>
                <button type="button" class="tab-btn" data-tab="kof19a7" onclick="openSubBranch('kof19a7')">📍 KOF 19A7</button>
                <button type="button" class="tab-btn" data-tab="maps" onclick="openInFrame('maps')">🗺️ Maps</button>
                <button type="button" class="tab-btn" data-tab="tiktok" onclick="openInFrame('tiktok')">📱 TikTok</button>
                <button type="button" class="tab-btn" data-tab="fb" onclick="openInFrame('fb')">📘 FB</button>
                <button type="button" class="tab-btn" data-tab="web" onclick="openInFrame('web')">🌐 Web</button>
            </div>
            <div class="viewer-actions">
                <button type="button" class="icon-btn" title="Reload frame" onclick="reloadFrame()">↻</button>
                <button type="button" class="icon-btn" title="Back to Home" onclick="closeInFrame()">✕</button>
            </div>
        </div>

        <div class="iframe-stage">
            <div id="frame-loader">
                <div class="spinner"></div>
                <span>Loading Inside KOF...</span>
            </div>
            <!--
                STRICT ANTI-ESCAPE SANDBOX:
                - Omitting `allow-top-navigation` blocks top-frame redirects.
                - Omitting `allow-popups` blocks target="_blank" & window.open() from escaping to script.google.com.
            -->
            <iframe 
                id="app-frame" 
                src="about:blank"
                sandbox="allow-scripts allow-same-origin allow-forms allow-modals allow-downloads"
                referrerpolicy="no-referrer-when-downgrade"
                allow="geolocation; payment; clipboard-write"
                loading="eager">
            </iframe>
        </div>
    </div>
</div>

<script>
const BASE_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbyBHs5chxyOcId3CqxQOkeUPAeF5SeBluT0naSKqFmPsFtJ98ctlAL5tqXcINQ57SPa/exec";

const ROUTES = {
    booking: BASE_SCRIPT_URL,
    kof19a7: `${BASE_SCRIPT_URL}?branch=kof19a7`,
    maps: "https://www.google.com/maps?q=King+Of+Fadez+Dasmariñas&output=embed",
    tiktok: "https://www.tiktok.com/embed/@kingoffadez.ph",
    fb: "https://www.facebook.com/plugins/post.php?href=https%3A%2F%2Fwww.facebook.com%2Fshare%2Fr%2F1NQfs6Fcer%2F&show_text=true&width=500",
    web: "https://kingoffadezph.com/"
};

const video = document.getElementById('bg-video');
const overlay = document.getElementById('inframe-overlay');
const wrapper = document.getElementById('main-wrapper');
const iframe = document.getElementById('app-frame');
const loader = document.getElementById('frame-loader');

let activeUrl = "";

// Core loader: accepts EITHER a route key ('kof19a7') OR any full sub-landing URL
function openInFrame(routeOrUrl, tabKey = null, forceReload = false) {
    const resolvedUrl = ROUTES[routeOrUrl] || routeOrUrl;
    if (!resolvedUrl) return;

    const resolvedTab = tabKey || (ROUTES[routeOrUrl] ? routeOrUrl : detectTabFromUrl(resolvedUrl));

    overlay.classList.add('active');
    overlay.setAttribute('aria-hidden', 'false');
    wrapper.classList.add('blur-active');

    document.querySelectorAll('.tab-btn').forEach(btn => {
        btn.classList.toggle('active', btn.dataset.tab === resolvedTab);
    });

    if (forceReload || activeUrl !== resolvedUrl || iframe.src === 'about:blank') {
        activeUrl = resolvedUrl;
        loader.classList.remove('hidden');
        iframe.src = resolvedUrl;
    }

    // Keep user on your own DNS while syncing ?branch=... in the address bar
    syncParentDnsUrl(resolvedUrl);
}

// Helper specifically for any sub-landing branch parameter (e.g., openSubBranch('kof19a7'))
function openSubBranch(branchCode) {
    const subUrl = `${BASE_SCRIPT_URL}?branch=${encodeURIComponent(branchCode)}`;
    openInFrame(subUrl, branchCode);
}

function detectTabFromUrl(url) {
    try {
        const parsed = new URL(url);
        const branch = parsed.searchParams.get('branch');
        if (branch) return branch;
    } catch (_) {}
    if (url.startsWith(BASE_SCRIPT_URL)) return 'booking';
    return '';
}

function syncParentDnsUrl(targetUrl) {
    try {
        const parsed = new URL(targetUrl);
        if (targetUrl.startsWith(BASE_SCRIPT_URL)) {
            const search = parsed.search; // e.g., "?branch=kof19a7" or ""
            const nextParentUrl = `${window.location.pathname}${search}`;
            window.history.replaceState({ inframeUrl: targetUrl }, "", nextParentUrl);
        }
    } catch (_) {}
}

function reloadFrame() {
    if (!activeUrl) return;
    loader.classList.remove('hidden');
    iframe.src = activeUrl;
}

function closeInFrame() {
    overlay.classList.remove('active');
    overlay.setAttribute('aria-hidden', 'true');
    wrapper.classList.remove('blur-active');
    // Reset query string back to root of your DNS without leaving the page
    window.history.replaceState({}, "", window.location.pathname);
}

iframe.addEventListener('load', () => {
    loader.classList.add('hidden');
});

// 1. AUTO-OPEN SUB-LANDING PAGES FROM YOUR OWN DNS URL
// If a visitor opens `yourdomain.com/?branch=kof19a7` or `yourdomain.com/#kof19a7`,
// it immediately opens inside the iframe without redirecting to script.google.com.
window.addEventListener('DOMContentLoaded', () => {
    const params = new URLSearchParams(window.location.search);
    const hashValue = window.location.hash.replace(/^#/, '').trim();

    if (params.toString()) {
        const directSubUrl = `${BASE_SCRIPT_URL}?${params.toString()}`;
        openInFrame(directSubUrl);
        return;
    }

    if (hashValue) {
        const cleanBranch = hashValue.replace(/^branch=/i, '');
        openSubBranch(cleanBranch);
        return;
    }

    // Silent background preload of main booking page so it opens instantaneously
    setTimeout(() => {
        if (!activeUrl) {
            activeUrl = ROUTES.booking;
            iframe.src = ROUTES.booking;
        }
    }, 800);
});

// 2. INTERCEPT EVERY LINK CLICK ON THE PARENT PAGE SO NOTHING EXITS YOUR DNS
document.addEventListener('click', (e) => {
    const anchor = e.target.closest('a[href]');
    if (!anchor) return;

    const href = anchor.getAttribute('href');
    if (!href || href.startsWith('javascript:')) return;

    e.preventDefault();
    openInFrame(anchor.href);
});

// 3. POSTMESSAGE LISTENER FOR SUB-PAGE BUTTONS INSIDE GOOGLE APPS SCRIPT
// Allows buttons inside the Apps Script sub-pages to tell the parent frame to switch URLs cleanly
window.addEventListener('message', (event) => {
    const data = event.data;
    if (!data) return;

    if (typeof data === 'string' && data.startsWith('http')) {
        openInFrame(data);
    } else if (typeof data === 'object') {
        if (data.url) openInFrame(data.url);
        else if (data.branch) openSubBranch(data.branch);
    }
});

// Tap anywhere to unmute background video
document.body.addEventListener('click', function() {
    if (video.muted) {
        video.muted = false;
        video.play().catch(() => {});
        const audioLabel = document.getElementById('audio-status');
        if (audioLabel) audioLabel.style.display = 'none';
    }
}, { once: true });
</script>

</body>
</html>
