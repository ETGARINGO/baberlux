
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#080808">
<meta name="robots" content="noindex,nofollow">

<title>KING OF FADEZ | Main Portal</title>

<style>
:root {
  --bg: #050505;
  --gold: #d4af37;
  --gold-light: #f9e6a1;
  --panel: #101010;
  --muted: #999;
}

* {
  box-sizing: border-box;
}

html, body {
  margin: 0;
  width: 100%;
  height: 100%;
  overflow: hidden;
  background: var(--bg);
  color: white;
  font-family: Inter, "Segoe UI", Arial, sans-serif;
  overscroll-behavior: none;
}

body {
  position: fixed;
  inset: 0;
}

#background {
  position: fixed;
  inset: 0;
  background:
    radial-gradient(ellipse at 50% 0%, #332710 0%, transparent 50%),
    linear-gradient(145deg, #17130a, #030303 75%);
  z-index: 0;
}

#particles {
  position: fixed;
  inset: 0;
  pointer-events: none;
  overflow: hidden;
  z-index: 1;
}

.particle {
  position: absolute;
  bottom: -10px;
  width: 3px;
  height: 3px;
  border-radius: 50%;
  background: var(--gold);
  box-shadow: 0 0 12px var(--gold);
  animation: floatUp linear infinite;
}

@keyframes floatUp {
  0% {
    transform: translateY(0);
    opacity: 0;
  }
  15% { opacity: .6; }
  85% { opacity: .4; }
  100% {
    transform: translateY(-110vh) translateX(30px);
    opacity: 0;
  }
}

@keyframes spin {
  to { transform: rotate(360deg); }
}

@keyframes pulse {
  50% { opacity: .45; }
}

/* HEADER */

.header {
  position: fixed;
  top: 0;
  left: 0;
  right: 0;
  height: 65px;
  z-index: 20;
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 0 24px;
  background: rgba(5,5,5,.94);
  border-bottom: 1px solid rgba(212,175,55,.25);
  backdrop-filter: blur(18px);
}

.brand {
  display: flex;
  align-items: center;
  gap: 11px;
}

.brand-icon {
  width: 38px;
  height: 38px;
  border-radius: 11px;
  display: grid;
  place-items: center;
  background: linear-gradient(145deg,#f5dc82,#98701c);
  color: #080808;
  font-size: 22px;
}

.brand-name {
  color: var(--gold);
  font-size: 12px;
  font-weight: 950;
  letter-spacing: 3px;
}

.brand-sub {
  color: #999;
  font-size: 8px;
  letter-spacing: 2px;
  margin-top: 4px;
}

.status {
  display: flex;
  align-items: center;
  gap: 8px;
  font-size: 9px;
  letter-spacing: 1.5px;
  color: #ccc;
}

.status-dot {
  width: 7px;
  height: 7px;
  border-radius: 50%;
  background: #36d98a;
  box-shadow: 0 0 10px #36d98a;
}

/* MAIN WORKSPACE */

#workspace {
  position: fixed;
  inset: 65px 0 0;
  z-index: 5;
  background: #fff;
}

#main-frame {
  display: block;
  width: 100%;
  height: 100%;
  border: 0;
  background: white;
}

/* LOADING */

#loading {
  position: fixed;
  inset: 65px 0 0;
  z-index: 10;
  display: flex;
  align-items: center;
  justify-content: center;
  flex-direction: column;
  background: #080808;
  text-align: center;
  transition: opacity .4s, visibility .4s;
}

#loading.hidden {
  opacity: 0;
  visibility: hidden;
  pointer-events: none;
}

.loader {
  width: 43px;
  height: 43px;
  border: 3px solid #ffffff18;
  border-top-color: var(--gold);
  border-radius: 50%;
  animation: spin .8s linear infinite;
  margin-bottom: 22px;
}

.loading-title {
  color: var(--gold);
  font-size: 12px;
  font-weight: 900;
  letter-spacing: 3px;
}

.loading-message {
  color: #888;
  font-size: 10px;
  max-width: 300px;
  line-height: 1.8;
  padding: 0 20px;
}

.loading-button {
  margin-top: 15px;
  padding: 11px 20px;
  background: linear-gradient(110deg,#98701c,#f4d979);
  border: 0;
  border-radius: 9px;
  color: #080808;
  font-size: 10px;
  font-weight: 900;
  letter-spacing: 1px;
  cursor: pointer;
}

/* FOOTER */

.footer {
  position: fixed;
  bottom: 0;
  left: 0;
  right: 0;
  height: 22px;
  z-index: 15;
  display: flex;
  justify-content: center;
  align-items: center;
  background: #080808;
  border-top: 1px solid #d4af3720;
  color: #777;
  font-size: 8px;
  letter-spacing: 1.5px;
}

/* MOBILE */

@media(max-width:600px) {
  .header {
    height: 55px;
    padding: 0 12px;
  }

  .brand-icon {
    width: 32px;
    height: 32px;
  }

  .brand-name {
    font-size: 10px;
    letter-spacing: 2px;
  }

  .brand-sub {
    font-size: 7px;
  }

  .status {
    font-size: 7px;
    letter-spacing: .5px;
  }

  #workspace {
    inset: 55px 0 0;
  }

  #loading {
    inset: 55px 0 0;
  }

  .footer {
    height: 18px;
    font-size: 7px;
  }
}

@media(prefers-reduced-motion:reduce) {
  *, *::before, *::after {
    animation-duration: .01ms !important;
    transition-duration: .01ms !important;
  }
}
</style>
</head>

<body>

<div id="background"></div>
<div id="particles"></div>

<!-- PERMANENT BRAND HEADER -->

<header class="header">

  <div class="brand">
    <div class="brand-icon">♛</div>

    <div>
      <div class="brand-name">KING OF FADEZ</div>
      <div class="brand-sub">BARBERSHOP MANAGEMENT SYSTEM</div>
    </div>
  </div>

  <div class="status">
    <span class="status-dot"></span>
    <span id="network-status">SYSTEM ACTIVE</span>
  </div>

</header>

<!-- PERMANENT MAIN FORM -->

<main id="workspace">

  <iframe
    id="main-frame"
    title="KING OF FADEZ Main Form"
    src="about:blank"
    allow="fullscreen; clipboard-read; clipboard-write"
    allowfullscreen
    referrerpolicy="strict-origin-when-cross-origin">
  </iframe>

</main>

<!-- LOADING SCREEN -->

<section id="loading">

  <div class="loader"></div>

  <div class="loading-title" id="loading-title">
    INITIALIZING PORTAL
  </div>

  <p class="loading-message" id="loading-message">
    Connecting to KING OF FADEZ main management form.
    Please wait...
  </p>

  <button
    class="loading-button"
    id="retry-button"
    onclick="reloadMainForm()"
    style="display:none">
    RECONNECT
  </button>

</section>

<footer class="footer">
  KING OF FADEZ • MAIN PORTAL • SECURE SESSION
</footer>

<script>
"use strict";

/* =====================================
   MAIN PORTAL CONFIGURATION
===================================== */

const MAIN_FORM_URL =
"https://script.google.com/macros/s/AKfycbyHa-4lFEOcib8bo166EwiaeM1GNnjnh9EpuPLoXpyveDD9HxJwYd7S6zihLAeCfO8/exec";

/* =====================================
   ELEMENTS
===================================== */

const frame = document.getElementById("main-frame");
const loading = document.getElementById("loading");

const loadingTitle =
document.getElementById("loading-title");

const loadingMessage =
document.getElementById("loading-message");

const retryButton =
document.getElementById("retry-button");

let loadingTimer = null;
let loadTimer = null;

/* =====================================
   PARTICLES
===================================== */

(function createParticles() {

  const container =
  document.getElementById("particles");

  for (let i = 0; i < 20; i++) {

    const particle =
    document.createElement("div");

    particle.className = "particle";

    particle.style.left =
    Math.random() * 100 + "%";

    particle.style.animationDuration =
    (9 + Math.random() * 12) + "s";

    particle.style.animationDelay =
    Math.random() * 12 + "s";

    container.appendChild(particle);
  }

})();

/* =====================================
   LOAD MAIN FORM
===================================== */

function loadMainForm() {

  clearTimeout(loadingTimer);
  clearTimeout(loadTimer);

  loading.classList.remove("hidden");

  loadingTitle.textContent =
  "CONNECTING TO MAIN FORM";

  loadingMessage.textContent =
  "Please wait while KING OF FADEZ loads your management portal.";

  retryButton.style.display = "none";

  // Always load the main form inside this iframe.
  frame.src = MAIN_FORM_URL;

  loadingTimer = setTimeout(() => {

    loadingTitle.textContent =
    "LOADING TAKING LONGER";

    loadingMessage.textContent =
    "The form is taking longer than expected. Please wait or reconnect.";

    retryButton.style.display = "inline-block";

  }, 20000);

}

/* =====================================
   FRAME STATUS
===================================== */

frame.addEventListener("load", () => {

  clearTimeout(loadingTimer);

  // The load event only indicates iframe navigation.
  // It does not guarantee that the remote form rendered.

  loadTimer = setTimeout(() => {

    loading.classList.add("hidden");

  }, 500);

});

/* =====================================
   RECONNECT
===================================== */

function reloadMainForm() {

  loadMainForm();

}

/* =====================================
   NETWORK STATUS
===================================== */

window.addEventListener("online", () => {

  document.getElementById("network-status")
  .textContent = "NETWORK ONLINE";

});

window.addEventListener("offline", () => {

  document.getElementById("network-status")
  .textContent = "NETWORK OFFLINE";

});

/* =====================================
   INITIALIZE
===================================== */

document.addEventListener("DOMContentLoaded", () => {

  loadMainForm();

});

/*
  PERMANENT PORTAL DESIGN

  - No administrator login.
  - No manager login.
  - No master key.
  - No exit button.
  - No home navigation.
  - No external module navigation.
  - Main form always embedded.
  - Reconnection reloads the same form.
*/

</script>

</body>
</html>
