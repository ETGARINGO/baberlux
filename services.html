<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport"
        content="width=device-width, initial-scale=1.0">

  <title>Price List</title>

  <!-- Website Logo / Favicon -->
  <link rel="icon" type="image/gif" href="kol.gif">

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, sans-serif;
      background: #f5f6fa;
      width: 100%;
      min-height: 100vh;
    }

    /* Main Container */
    .container {
      width: 100%;
      max-width: 1200px;
      margin: auto;
      padding: 12px;
    }

    /* Header */
    .header {
      text-align: center;
      padding: 15px 5px;
    }

    .logo {
      width: 70px;
      height: 70px;
      object-fit: contain;
      display: block;
      margin: 0 auto 10px;
    }

    .header h2 {
      font-size: 22px;
      color: #222;
      font-weight: bold;
    }

    .header p {
      font-size: 13px;
      color: #777;
      margin-top: 5px;
    }

    /* Google Sheet Frame */
    .sheet-container {
      width: 100%;
      height: 85vh;
      min-height: 500px;
      overflow: hidden;
      background: #fff;
      border-radius: 10px;
      box-shadow: 0 2px 10px rgba(0,0,0,.08);
    }

    iframe {
      width: 100%;
      height: 100%;
      border: none;
      display: block;
    }

    /* Footer */
    .footer {
      text-align: center;
      padding: 15px 5px;
      font-size: 12px;
      color: #888;
    }

    /* Mobile Responsive */
    @media (max-width: 600px) {

      .container {
        padding: 5px;
      }

      .header {
        padding: 12px 5px;
      }

      .logo {
        width: 60px;
        height: 60px;
      }

      .header h2 {
        font-size: 19px;
      }

      .sheet-container {
        height: 88vh;
        min-height: 450px;
        border-radius: 5px;
      }

      .footer {
        font-size: 11px;
      }
    }
  </style>
</head>

<body>

  <div class="container">

    <!-- Header / Logo -->
    <div class="header">

      <img
        src="kol.gif"
        alt="KOL Logo"
        class="logo">

      <h2>Price List</h2>

      <p>Our Services and Pricing</p>

    </div>

    <!-- Google Spreadsheet -->
    <div class="sheet-container">

      <iframe
        src="https://docs.google.com/spreadsheets/d/e/YOUR_PUBLISHED_SHEET_ID/pubhtml?gid=0&widget=true&headers=false"
        loading="lazy"
        title="Price List Spreadsheet">
      </iframe>

    </div>

    <!-- Footer -->
    <div class="footer">
      &copy; 2026 Price List. All Rights Reserved.
    </div>

  </div>

</body>
</html>
