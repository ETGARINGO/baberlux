```html
<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8">

  <meta name="viewport"
        content="width=device-width,
                 initial-scale=1.0,
                 maximum-scale=1.0,
                 user-scalable=no">

  <meta name="theme-color" content="#0f172a">

  <title>Price List</title>

  <link rel="icon" type="image/gif" href="kol.gif">


  <style>

    /* =========================================================
       RESET
    ========================================================= */

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }


    html,
    body {
      width: 100%;
      height: 100%;

      overflow: hidden;

      background: #020617;
    }


    body {
      font-family:
        Inter,
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        Roboto,
        Arial,
        sans-serif;
    }


    button {
      font-family: inherit;
    }


    /* =========================================================
       MAIN APPLICATION
    ========================================================= */

    #app {
      width: 100%;
      height: 100dvh;

      display: flex;
      flex-direction: column;

      overflow: hidden;

      background:
        radial-gradient(
          circle at top left,
          #1e293b 0%,
          #0f172a 45%,
          #020617 100%
        );
    }


    /* =========================================================
       HEADER
    ========================================================= */

    .topbar {
      height: 64px;
      min-height: 64px;

      padding: 0 18px;

      display: flex;
      align-items: center;
      justify-content: space-between;

      background: rgba(2, 6, 23, 0.95);

      border-bottom: 1px solid rgba(255,255,255,.08);

      position: relative;

      z-index: 100;

      backdrop-filter: blur(15px);
      -webkit-backdrop-filter: blur(15px);
    }


    .brand {
      display: flex;
      align-items: center;

      gap: 11px;

      min-width: 0;
    }


    .logo-box {
      width: 40px;
      height: 40px;

      flex-shrink: 0;

      display: flex;
      align-items: center;
      justify-content: center;

      overflow: hidden;

      border-radius: 10px;

      background: rgba(255,255,255,.08);

      border: 1px solid rgba(255,255,255,.1);
    }


    .logo {
      width: 100%;
      height: 100%;

      object-fit: contain;
    }


    .title {
      color: white;

      font-size: 15px;

      font-weight: 700;

      line-height: 1.2;
    }


    .subtitle {
      margin-top: 3px;

      color: rgba(255,255,255,.45);

      font-size: 10px;

      font-weight: 500;
    }


    /* =========================================================
       BUTTONS
    ========================================================= */

    .actions {
      display: flex;
      align-items: center;

      gap: 8px;
    }


    .edit-status {
      display: flex;
      align-items: center;

      gap: 7px;

      padding: 7px 10px;

      border-radius: 999px;

      background: rgba(34,197,94,.08);

      border: 1px solid rgba(34,197,94,.15);

      color: rgba(255,255,255,.65);

      font-size: 10px;

      font-weight: 600;
    }


    .green-dot {
      width: 6px;
      height: 6px;

      border-radius: 50%;

      background: #22c55e;

      box-shadow:
        0 0 10px rgba(34,197,94,.9);
    }


    .button {
      width: 38px;
      height: 38px;

      border: 1px solid rgba(255,255,255,.1);

      border-radius: 9px;

      background: rgba(255,255,255,.06);

      color: white;

      cursor: pointer;

      display: flex;
      align-items: center;
      justify-content: center;

      transition: .2s ease;
    }


    .button:hover {
      background: rgba(255,255,255,.12);

      transform: translateY(-1px);
    }


    .button svg {
      width: 17px;
      height: 17px;

      fill: none;

      stroke: currentColor;

      stroke-width: 1.8;

      stroke-linecap: round;

      stroke-linejoin: round;
    }


    /* =========================================================
       CONTENT
    ========================================================= */

    .content {
      flex: 1;

      min-height: 0;

      padding: 10px;

      overflow: hidden;

      display: flex;
    }


    /* =========================================================
       GOOGLE SHEET
    ========================================================= */

    .sheet {
      width: 100%;
      height: 100%;

      min-height: 0;

      background: white;

      border-radius: 10px;

      overflow: hidden;

      position: relative;

      box-shadow:
        0 15px 50px rgba(0,0,0,.3);
    }


    iframe {
      width: 100%;
      height: 100%;

      display: block;

      border: 0;

      background: white;
    }


    /* =========================================================
       LOADING
    ========================================================= */

    .loading {
      position: absolute;

      inset: 0;

      z-index: 20;

      display: flex;

      flex-direction: column;

      align-items: center;

      justify-content: center;

      background: white;

      transition:
        opacity .35s ease,
        visibility .35s ease;
    }


    .loading.hide {
      opacity: 0;

      visibility: hidden;

      pointer-events: none;
    }


    .spinner {
      width: 32px;
      height: 32px;

      border: 3px solid #e5e7eb;

      border-top-color: #334155;

      border-radius: 50%;

      animation: spin .8s linear infinite;
    }


    @keyframes spin {

      to {
        transform: rotate(360deg);
      }

    }


    .loading-text {
      margin-top: 12px;

      color: #64748b;

      font-size: 11px;

      font-weight: 500;
    }


    /* =========================================================
       FOOTER
    ========================================================= */

    .footer {
      height: 30px;
      min-height: 30px;

      display: flex;

      align-items: center;
      justify-content: center;

      color: rgba(255,255,255,.3);

      font-size: 9px;
    }


    /* =========================================================
       TRUE FULLSCREEN MODE
    ========================================================= */

    .fullscreen .topbar,
    .fullscreen .footer {
      display: none;
    }


    .fullscreen .content {
      padding: 0;
    }


    .fullscreen .sheet {
      border-radius: 0;

      box-shadow: none;
    }


    /* =========================================================
       MOBILE
    ========================================================= */

    @media (max-width: 700px) {

      .topbar {
        height: 56px;
        min-height: 56px;

        padding: 0 10px;
      }


      .logo-box {
        width: 35px;
        height: 35px;

        border-radius: 8px;
      }


      .brand {
        gap: 9px;
      }


      .title {
        font-size: 13px;
      }


      .subtitle {
        font-size: 9px;
      }


      .edit-status {
        display: none;
      }


      .button {
        width: 34px;
        height: 34px;
      }


      .content {
        padding: 5px;
      }


      .sheet {
        border-radius: 6px;
      }


      .footer {
        display: none;
      }

    }


    /* =========================================================
       SMALL MOBILE
    ========================================================= */

    @media (max-width: 400px) {

      .subtitle {
        display: none;
      }


      .content {
        padding: 2px;
      }


      .sheet {
        border-radius: 3px;
      }

    }

  </style>

</head>


<body>


<div id="app">


  <!-- =======================================================
       HEADER
  ======================================================== -->

  <header class="topbar">

    <div class="brand">

      <div class="logo-box">

        <img
          src="kol.gif"
          alt="KOL"
          class="logo">

      </div>


      <div>

        <div class="title">
          Price List
        </div>

        <div class="subtitle">
          Editable Services &amp; Pricing
        </div>

      </div>

    </div>


    <div class="actions">


      <div class="edit-status">

        <span class="green-dot"></span>

        Editable

      </div>


      <!-- FULLSCREEN BUTTON -->

      <button
        class="button"
        id="fullscreenButton"
        title="Fullscreen">

        <svg viewBox="0 0 24 24">

          <path d="M8 3H3v5"></path>

          <path d="M16 3h5v5"></path>

          <path d="M8 21H3v-5"></path>

          <path d="M21 16v5h-5"></path>

        </svg>

      </button>

    </div>

  </header>



  <!-- =======================================================
       CONTENT
  ======================================================== -->

  <main class="content">


    <section class="sheet">


      <!-- LOADING SCREEN -->

      <div
        class="loading"
        id="loading">

        <div class="spinner"></div>

        <div class="loading-text">
          Opening editable price list...
        </div>

      </div>



      <!-- ===================================================
           GOOGLE SHEET

           IMPORTANT:
           Keep /edit so authorized users can edit.
      ==================================================== -->

      <iframe
        id="googleSheet"
        src="https://docs.google.com/spreadsheets/d/1ydNyxwbr8HSSwodhGxC1_bQIgviP37ymzWFf2zWylUg/edit"
        title="Editable Price List"
        allow="fullscreen"
        loading="eager">
      </iframe>


    </section>

  </main>



  <!-- =======================================================
       FOOTER
  ======================================================== -->

  <footer class="footer">

    Editable Price List · 2026

  </footer>


</div>



<script>

  /* =========================================================
     ELEMENTS
  ========================================================= */

  const app =
    document.getElementById("app");

  const iframe =
    document.getElementById("googleSheet");

  const loading =
    document.getElementById("loading");

  const fullscreenButton =
    document.getElementById("fullscreenButton");


  /* =========================================================
     HIDE LOADING SCREEN
  ========================================================= */

  iframe.addEventListener(
    "load",
    function () {

      setTimeout(function () {

        loading.classList.add("hide");

      }, 400);

    }
  );


  /* =========================================================
     ENTER FULLSCREEN
  ========================================================= */

  async function enterFullscreen() {

    try {

      if (!document.fullscreenElement) {

        await app.requestFullscreen();

      }

    } catch (error) {

      console.log(
        "Fullscreen request was blocked by the browser."
      );

    }

  }


  /* =========================================================
     EXIT FULLSCREEN
  ========================================================= */

  async function exitFullscreen() {

    try {

      if (document.fullscreenElement) {

        await document.exitFullscreen();

      }

    } catch (error) {

      console.log(
        "Unable to exit fullscreen."
      );

    }

  }


  /* =========================================================
     BUTTON
  ========================================================= */

  fullscreenButton.addEventListener(
    "click",
    function () {

      if (document.fullscreenElement) {

        exitFullscreen();

      } else {

        enterFullscreen();

      }

    }
  );


  /* =========================================================
     FULLSCREEN STATE
  ========================================================= */

  document.addEventListener(
    "fullscreenchange",
    function () {

      if (document.fullscreenElement) {

        app.classList.add("fullscreen");

      } else {

        app.classList.remove("fullscreen");

      }

    }
  );


  /* =========================================================
     KEYBOARD SHORTCUT
     F = FULLSCREEN
     ESC = EXIT
  ========================================================= */

  document.addEventListener(
    "keydown",
    function (event) {

      if (
        event.key.toLowerCase() === "f" &&
        event.target.tagName !== "INPUT" &&
        event.target.tagName !== "TEXTAREA"
      ) {

        if (document.fullscreenElement) {

          exitFullscreen();

        } else {

          enterFullscreen();

        }

      }

    }
  );


  /* =========================================================
     AUTO FULLSCREEN

     Browsers normally block fullscreen when a page loads
     because fullscreen requires user interaction.

     We therefore attempt it automatically. If the browser
     blocks it, the fullscreen button remains available.
  ========================================================= */

  window.addEventListener(
    "load",
    function () {

      setTimeout(function () {

        enterFullscreen();

      }, 300);

    }
  );


  /* =========================================================
     MOBILE HEIGHT FIX
  ========================================================= */

  function updateHeight() {

    app.style.height =
      window.innerHeight + "px";

  }


  updateHeight();


  window.addEventListener(
    "resize",
    updateHeight
  );

</script>


</body>

</html>
