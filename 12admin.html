<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#050505">
  <link rel="icon" type="image/png" href="SHOP_BRANDING.jpg">
  <link rel="apple-touch-icon" href="SHOP_BRANDING.jpg">
  <!-- Instant link prefetching for lightning speed -->
  <link rel="prefetch" href="https://script.google.com/macros/s/AKfycbyTDzZ6H1AF7R-FJ6jxyhslQgK0sY5VK35GHGjDiG893QxgLRDdbhBtllS_32mwtvRf/exec?page=admin&branch=main">
  <title>KOF | Admin Control Setup</title>

  <style>
    :root {
      --gold: #d4af37;
      --gold-light: #f3e5ab;
      --glass: rgba(12, 12, 12, 0.82);
      --gold-gradient: linear-gradient(135deg, #e5c158 0%, #d4af37 50%, #aa7c11 100%);
      --green: #2ecc71;
      --red: #e74c3c;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    html, body {
      width: 100%;
      height: 100%;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Arial, sans-serif;
      background: #050505;
      color: #fff;
      overflow: hidden;
    }

    #bg-video {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      filter: brightness(0.35) contrast(1.15);
      z-index: 0;
    }

    .vignette {
      position: fixed;
      inset: 0;
      background: radial-gradient(circle at center, transparent 20%, rgba(0, 0, 0, 0.88) 100%);
      z-index: 1;
      pointer-events: none;
    }

    #overlay {
      position: fixed;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 16px;
      z-index: 2;
    }

    .card {
      width: 100%;
      max-width: 410px;
      padding: 26px 20px;
      background: var(--glass);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border-radius: 26px;
      border: 1px solid rgba(212, 175, 55, 0.38);
      text-align: center;
      box-shadow: 0 25px 60px rgba(0, 0, 0, 0.95);
      will-change: transform, opacity;
    }

    @keyframes shake {
      0%, 100% { transform: translateX(0); }
      20%, 60% { transform: translateX(-7px); }
      40%, 80% { transform: translateX(7px); }
    }

    .shake {
      animation: shake 0.3s ease-in-out;
    }

    .top-meta {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
    }

    .admin-badge {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      background: rgba(212, 175, 55, 0.12);
      border: 1px solid rgba(212, 175, 55, 0.45);
      color: var(--gold);
      font-size: 0.62rem;
      font-weight: 800;
      letter-spacing: 1.5px;
      padding: 4px 10px;
      border-radius: 20px;
      text-transform: uppercase;
    }

    #liveClock {
      font-size: 0.68rem;
      font-weight: 700;
      color: #999;
      letter-spacing: 0.8px;
    }

    .crown-icon {
      font-size: 2.4rem;
      filter: drop-shadow(0 0 12px rgba(212, 175, 55, 0.5));
      line-height: 1;
    }

    h1 {
      background: var(--gold-gradient);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      letter-spacing: 3px;
      margin: 6px 0 2px;
      font-size: 1.45rem;
      text-transform: uppercase;
      font-weight: 900;
    }

    .tagline {
      font-size: 0.65rem;
      letter-spacing: 2px;
      margin-bottom: 16px;
      color: #aaa;
      font-weight: 600;
    }

    /* PIN LOCK SCREEN */
    #lock-screen {
      display: block;
    }

    .pin-dots {
      display: flex;
      justify-content: center;
      gap: 14px;
      margin-bottom: 12px;
    }

    .pin-dot {
      width: 13px;
      height: 13px;
      border-radius: 50%;
      border: 2px solid rgba(212, 175, 55, 0.5);
      background: transparent;
      transition: all 0.1s ease;
    }

    .pin-dot.filled {
      background: var(--gold);
      border-color: var(--gold);
      box-shadow: 0 0 10px rgba(212, 175, 55, 0.7);
    }

    .pin-dot.error {
      border-color: var(--red);
      background: var(--red);
    }

    #pin-error {
      color: var(--red);
      font-size: 0.72rem;
      font-weight: 700;
      min-height: 16px;
      margin-bottom: 8px;
      opacity: 0;
      transition: opacity 0.15s;
    }

    #pin-error.visible {
      opacity: 1;
    }

    .keypad {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
      max-width: 270px;
      margin: 0 auto 10px;
    }

    .key-btn {
      height: 48px;
      border-radius: 12px;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.08);
      color: #fff;
      font-size: 1.2rem;
      font-weight: 700;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background 0.1s;
    }

    .key-btn:active {
      transform: scale(0.93);
      background: rgba(212, 175, 55, 0.25);
    }

    .key-btn.action-key {
      font-size: 0.8rem;
      color: #aaa;
    }

    /* ADMIN DASHBOARD */
    #admin-panel {
      display: none;
    }

    .status-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: rgba(0, 0, 0, 0.55);
      border: 1px solid rgba(255, 255, 255, 0.08);
      padding: 10px 14px;
      border-radius: 14px;
      margin-bottom: 14px;
      font-size: 0.78rem;
    }

    .status-indicator {
      display: flex;
      align-items: center;
      gap: 8px;
      font-weight: 800;
    }

    .dot {
      width: 9px;
      height: 9px;
      border-radius: 50%;
      background: var(--green);
      box-shadow: 0 0 8px var(--green);
    }

    .dot.closed {
      background: var(--red);
      box-shadow: 0 0 8px var(--red);
    }

    .toggle-btn {
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.15);
      color: #fff;
      font-size: 0.68rem;
      font-weight: 700;
      padding: 5px 10px;
      border-radius: 8px;
      cursor: pointer;
    }

    .control-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin-bottom: 14px;
    }

    .ctrl-btn {
      padding: 14px 8px;
      border-radius: 14px;
      background: rgba(0, 0, 0, 0.55);
      border: 1px solid rgba(212, 175, 55, 0.22);
      color: #fff;
      font-size: 0.76rem;
      font-weight: 700;
      cursor: pointer;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 5px;
      transition: transform 0.1s;
    }

    .ctrl-btn span.icon {
      font-size: 1.35rem;
    }

    .ctrl-btn span.sub-label {
      font-size: 0.58rem;
      color: #888;
      font-weight: 500;
    }

    .ctrl-btn:active {
      transform: scale(0.96);
      border-color: var(--gold);
    }

    .primary-btn {
      display: block;
      width: 100%;
      padding: 15px;
      border-radius: 14px;
      background: var(--gold-gradient);
      color: #000;
      font-size: 0.84rem;
      font-weight: 900;
      letter-spacing: 1px;
      text-transform: uppercase;
      border: none;
      cursor: pointer;
      box-shadow: 0 6px 20px rgba(212, 175, 55, 0.3);
    }

    .secondary-actions {
      display: flex;
      justify-content: space-between;
      margin-top: 10px;
      gap: 10px;
    }

    .sub-btn {
      flex: 1;
      padding: 10px;
      border-radius: 10px;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.08);
      color: #bbb;
      font-size: 0.7rem;
      font-weight: 600;
      cursor: pointer;
    }

    /* INSTANT ADMIN MODAL */
    #adminModal {
      position: fixed;
      inset: 0;
      background: #080808;
      z-index: 9999;
      display: none;
      flex-direction: column;
      will-change: transform, opacity;
      transform: translate3d(0, 100%, 0);
      transition: transform 0.22s cubic-bezier(0.1, 1, 0.2, 1);
    }

    #adminModal.active {
      display: flex;
      transform: translate3d(0, 0, 0);
    }

    .modal-header {
      height: 54px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 16px;
      color: var(--gold);
      border-bottom: 1px solid rgba(212, 175, 55, 0.3);
      background: #0b0b0b;
      font-weight: 800;
      font-size: 0.82rem;
      letter-spacing: 1.2px;
      text-transform: uppercase;
      flex-shrink: 0;
    }

    .header-actions {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .icon-btn {
      background: rgba(255, 255, 255, 0.07);
      border: 1px solid rgba(255, 255, 255, 0.12);
      color: #fff;
      padding: 6px 10px;
      border-radius: 8px;
      font-size: 0.75rem;
      font-weight: 700;
      cursor: pointer;
    }

    .iframe-wrapper {
      position: relative;
      width: 100%;
      height: calc(100% - 54px);
      background: #0a0a0a;
    }

    #frameLoader {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: #0a0a0a;
      color: var(--gold);
      gap: 10px;
      font-size: 0.72rem;
      font-weight: 700;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      z-index: 2;
      opacity: 1;
      transition: opacity 0.15s ease;
      pointer-events: none;
    }

    #frameLoader.hidden {
      opacity: 0;
    }

    .spinner {
      width: 30px;
      height: 30px;
      border: 3px solid rgba(212, 175, 55, 0.2);
      border-top-color: var(--gold);
      border-radius: 50%;
      animation: spin 0.6s linear infinite;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    #adminFrame {
      width: 100%;
      height: 100%;
      border: none;
      background: #fff;
    }
  </style>
</head>
<body>

  <!-- VIDEO BACKGROUND -->
  <video id="bg-video" autoplay muted loop playsinline preload="auto">
    <source src="IMG_1039.MOV" type="video/mp4">
    <source src="IMG_1039.MOV" type="video/quicktime">
  </video>
  <div class="vignette"></div>

  <!-- MAIN OVERLAY -->
  <div id="overlay">
    <div class="card" id="mainCard">
      <div class="top-meta">
        <span class="admin-badge">🔐 Admin Control</span>
        <span id="liveClock">--:--</span>
      </div>

      <div class="crown-icon">👑</div>
      <h1>King of Fadez</h1>
      <div class="tagline">DASMARIÑAS BRANCH • COMMAND CENTER</div>

      <!-- 1. PIN LOCK SCREEN -->
      <div id="lock-screen">
        <div class="pin-dots" id="pinDots">
          <div class="pin-dot"></div>
          <div class="pin-dot"></div>
          <div class="pin-dot"></div>
          <div class="pin-dot"></div>
        </div>
        <div id="pin-error">Invalid PIN</div>

        <div class="keypad">
          <button class="key-btn" data-num="1">1</button>
          <button class="key-btn" data-num="2">2</button>
          <button class="key-btn" data-num="3">3</button>
          <button class="key-btn" data-num="4">4</button>
          <button class="key-btn" data-num="5">5</button>
          <button class="key-btn" data-num="6">6</button>
          <button class="key-btn" data-num="7">7</button>
          <button class="key-btn" data-num="8">8</button>
          <button class="key-btn" data-num="9">9</button>
          <button class="key-btn action-key" id="clearPinBtn">CLR</button>
          <button class="key-btn" data-num="0">0</button>
          <button class="key-btn action-key" id="delPinBtn">⌫</button>
        </div>
      </div>

      <!-- 2. ADMIN CONTROL PANEL -->
      <div id="admin-panel">
        <div class="status-bar">
          <div class="status-indicator">
            <span class="dot" id="statusDot"></span>
            <span id="statusText">SHOP OPEN</span>
          </div>
          <button class="toggle-btn" id="toggleStatusBtn">Switch</button>
        </div>

        <div class="control-grid">
          <button class="ctrl-btn" data-title="Live Appointments" data-page="admin" data-view="admin">
            <span class="icon">📅</span>
            <span>Bookings</span>
            <span class="sub-label">Queue & List</span>
          </button>
          <button class="ctrl-btn" data-title="Walk-In / POS Entry" data-page="admin" data-view="walkin">
            <span class="icon">✂️</span>
            <span>POS / Walk-In</span>
            <span class="sub-label">Quick Ticket</span>
          </button>
          <button class="ctrl-btn" data-title="Barber Roster & Shifts" data-page="admin" data-view="barbers">
            <span class="icon">💈</span>
            <span>Barbers</span>
            <span class="sub-label">Shifts & Staff</span>
          </button>
          <button class="ctrl-btn" data-title="Services & Pricing Setup" data-page="admin" data-view="settings">
            <span class="icon">⚙️</span>
            <span>Shop Setup</span>
            <span class="sub-label">Rates & Promos</span>
          </button>
        </div>

        <button class="primary-btn" id="openFullAdmin">Open Full Admin Console</button>

        <div class="secondary-actions">
          <button class="sub-btn" id="openClientView">👁️ Client Preview</button>
          <button class="sub-btn" id="lockBtn">🔒 Lock</button>
        </div>
      </div>
    </div>
  </div>

  <!-- INSTANT PRE-LOADED ADMIN MODAL -->
  <div id="adminModal">
    <div class="modal-header">
      <span id="modalTitle">Admin Console</span>
      <div class="header-actions">
        <button class="icon-btn" id="reloadFrame" title="Reload">↻</button>
        <button class="icon-btn" id="closeModal" aria-label="Close">✕</button>
      </div>
    </div>

    <div class="iframe-wrapper">
      <div id="frameLoader">
        <div class="spinner"></div>
        <span>Loading App...</span>
      </div>
      <iframe
        id="adminFrame"
        src="about:blank"
        allow="camera; microphone; clipboard-read; clipboard-write; geolocation">
      </iframe>
    </div>
  </div>

  <script>
    const ADMIN_PIN = "2026";
    const BASE_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbyTDzZ6H1AF7R-FJ6jxyhslQgK0sY5VK35GHGjDiG893QxgLRDdbhBtllS_32mwtvRf/exec";
    const BRANCH = "main";

    const mainCard = document.getElementById('mainCard');
    const lockScreen = document.getElementById('lock-screen');
    const adminPanel = document.getElementById('admin-panel');
    const pinDots = document.querySelectorAll('.pin-dot');
    const pinError = document.getElementById('pin-error');
    const adminModal = document.getElementById('adminModal');
    const adminFrame = document.getElementById('adminFrame');
    const frameLoader = document.getElementById('frameLoader');
    const modalTitle = document.getElementById('modalTitle');

    let enteredPin = "";
    let currentSrc = "";

    // Live Clock
    function updateClock() {
      const now = new Date();
      document.getElementById('liveClock').textContent = now.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
    }
    updateClock();
    setInterval(updateClock, 15000);

    // Instant unlock check
    if (sessionStorage.getItem('kof_admin_unlocked') === 'true') {
      showAdminPanel();
    }

    function showAdminPanel() {
      lockScreen.style.display = 'none';
      adminPanel.style.display = 'block';
    }

    function lockAdminPanel() {
      sessionStorage.removeItem('kof_admin_unlocked');
      enteredPin = "";
      updatePinDots();
      adminPanel.style.display = 'none';
      lockScreen.style.display = 'block';
    }

    function updatePinDots(isError = false) {
      pinDots.forEach((dot, index) => {
        dot.classList.remove('filled', 'error');
        if (isError) dot.classList.add('error');
        else if (index < enteredPin.length) dot.classList.add('filled');
      });
    }

    function handleDigitInput(digit) {
      if (enteredPin.length >= ADMIN_PIN.length) return;
      pinError.classList.remove('visible');
      enteredPin += digit;
      updatePinDots();

      if (enteredPin.length === ADMIN_PIN.length) {
        setTimeout(verifyPin, 80);
      }
    }

    function verifyPin() {
      if (enteredPin === ADMIN_PIN) {
        sessionStorage.setItem('kof_admin_unlocked', 'true');
        showAdminPanel();
      } else {
        updatePinDots(true);
        pinError.classList.add('visible');
        mainCard.classList.remove('shake');
        void mainCard.offsetWidth;
        mainCard.classList.add('shake');
        setTimeout(() => { enteredPin = ""; updatePinDots(); }, 350);
      }
    }

    document.querySelectorAll('.key-btn[data-num]').forEach(btn => {
      btn.addEventListener('click', () => handleDigitInput(btn.dataset.num));
    });
    document.getElementById('clearPinBtn').addEventListener('click', () => { enteredPin = ""; updatePinDots(); });
    document.getElementById('delPinBtn').addEventListener('click', () => { enteredPin = enteredPin.slice(0, -1); updatePinDots(); });

    document.addEventListener('keydown', (e) => {
      if (lockScreen.style.display === 'none') return;
      if (e.key >= '0' && e.key <= '9') handleDigitInput(e.key);
      else if (e.key === 'Backspace') { enteredPin = enteredPin.slice(0, -1); updatePinDots(); }
    });

    document.getElementById('lockBtn').addEventListener('click', lockAdminPanel);

    // Shop Status Toggle
    let isShopOpen = localStorage.getItem('kof_shop_open') !== 'false';
    const statusDot = document.getElementById('statusDot');
    const statusText = document.getElementById('statusText');

    function updateStatusUI() {
      statusDot.classList.toggle('closed', !isShopOpen);
      statusText.textContent = isShopOpen ? 'SHOP OPEN' : 'SHOP CLOSED';
      statusText.style.color = isShopOpen ? '#2ecc71' : '#e74c3c';
    }
    updateStatusUI();

    document.getElementById('toggleStatusBtn').addEventListener('click', () => {
      isShopOpen = !isShopOpen;
      localStorage.setItem('kof_shop_open', isShopOpen);
      updateStatusUI();
    });

    // Lightning Fast Route Launcher
    function launchRoute(title, pageParam, viewParam) {
      modalTitle.textContent = title;

      const url = new URL(BASE_SCRIPT_URL);
      url.searchParams.set('page', pageParam);
      url.searchParams.set('branch', BRANCH);
      if (viewParam) url.searchParams.set('view', viewParam);

      const targetUrl = url.toString();

      if (currentSrc !== targetUrl) {
        currentSrc = targetUrl;
        frameLoader.classList.remove('hidden');
        adminFrame.src = targetUrl;
      }

      adminModal.style.display = 'flex';
      requestAnimationFrame(() => adminModal.classList.add('active'));
    }

    adminFrame.addEventListener('load', () => {
      frameLoader.classList.add('hidden');
    });

    document.querySelectorAll('.ctrl-btn').forEach(btn => {
      btn.addEventListener('click', () => launchRoute(btn.dataset.title, btn.dataset.page, btn.dataset.view));
    });

    document.getElementById('openFullAdmin').addEventListener('click', () => launchRoute('Full Admin Console', 'admin', 'admin'));
    document.getElementById('openClientView').addEventListener('click', () => launchRoute('Client Booking Preview', 'client', 'client'));

    document.getElementById('reloadFrame').addEventListener('click', () => {
      frameLoader.classList.remove('hidden');
      adminFrame.src = adminFrame.src;
    });

    document.getElementById('closeModal').addEventListener('click', () => {
      adminModal.classList.remove('active');
    });
  </script>

</body>
</html>
