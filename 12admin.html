<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#050505">
  <link rel="icon" type="image/png" href="SHOP_BRANDING.jpg">
  <link rel="apple-touch-icon" href="SHOP_BRANDING.jpg">
  <title>KOF | Admin Control Setup</title>

  <style>
    :root {
      --gold: #d4af37;
      --gold-light: #f3e5ab;
      --gold-dim: rgba(212, 175, 55, 0.25);
      --glass: rgba(12, 12, 12, 0.78);
      --gold-gradient: linear-gradient(135deg, #e5c158 0%, #d4af37 50%, #aa7c11 100%);
      --green: #2ecc71;
      --red: #e74c3c;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    html, body {
      width: 100%;
      height: 100%;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Arial, sans-serif;
      background: #050505;
      color: #fff;
      overflow: hidden;
    }

    /* BACKGROUND VIDEO & AMBIENT VIGNETTE */
    #bg-video {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      filter: brightness(0.35) contrast(1.15);
      z-index: 0;
    }

    .vignette {
      position: fixed;
      inset: 0;
      background: radial-gradient(circle at center, transparent 20%, rgba(0, 0, 0, 0.85) 100%);
      z-index: 1;
      pointer-events: none;
    }

    /* MAIN OVERLAY */
    #overlay {
      position: fixed;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 16px;
      z-index: 2;
      overflow-y: auto;
    }

    /* GLASS CARD */
    .card {
      width: 100%;
      max-width: 410px;
      padding: 28px 22px;
      background: var(--glass);
      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);
      border-radius: 28px;
      border: 1px solid rgba(212, 175, 55, 0.38);
      text-align: center;
      box-shadow: 0 25px 60px rgba(0, 0, 0, 0.95), inset 0 1px 0 rgba(255, 255, 255, 0.08);
      animation: cardEntrance 0.5s cubic-bezier(0.16, 1, 0.3, 1);
    }

    @keyframes cardEntrance {
      from { opacity: 0; transform: translateY(16px) scale(0.98); }
      to { opacity: 1; transform: translateY(0) scale(1); }
    }

    @keyframes shake {
      0%, 100% { transform: translateX(0); }
      20%, 60% { transform: translateX(-8px); }
      40%, 80% { transform: translateX(8px); }
    }

    .shake {
      animation: shake 0.35s ease-in-out;
    }

    .top-meta {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 14px;
    }

    .admin-badge {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      background: rgba(212, 175, 55, 0.12);
      border: 1px solid rgba(212, 175, 55, 0.45);
      color: var(--gold);
      font-size: 0.62rem;
      font-weight: 800;
      letter-spacing: 1.5px;
      padding: 4px 10px;
      border-radius: 20px;
      text-transform: uppercase;
    }

    #liveClock {
      font-size: 0.68rem;
      font-weight: 700;
      color: #999;
      letter-spacing: 0.8px;
      font-variant-numeric: tabular-nums;
    }

    .crown-icon {
      font-size: 2.6rem;
      filter: drop-shadow(0 0 14px rgba(212, 175, 55, 0.55));
      line-height: 1;
    }

    h1 {
      background: var(--gold-gradient);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      letter-spacing: 3px;
      margin: 8px 0 4px;
      font-size: 1.55rem;
      text-transform: uppercase;
      font-weight: 900;
    }

    .tagline {
      font-size: 0.68rem;
      letter-spacing: 2px;
      margin-bottom: 20px;
      color: #aaa;
      font-weight: 600;
    }

    /* PIN LOCK SCREEN */
    #lock-screen {
      display: block;
    }

    .pin-dots {
      display: flex;
      justify-content: center;
      gap: 14px;
      margin-bottom: 14px;
    }

    .pin-dot {
      width: 14px;
      height: 14px;
      border-radius: 50%;
      border: 2px solid rgba(212, 175, 55, 0.5);
      background: transparent;
      transition: all 0.15s ease;
    }

    .pin-dot.filled {
      background: var(--gold);
      border-color: var(--gold);
      box-shadow: 0 0 10px rgba(212, 175, 55, 0.7);
      transform: scale(1.1);
    }

    .pin-dot.error {
      border-color: var(--red);
      background: var(--red);
      box-shadow: 0 0 10px var(--red);
    }

    #pin-error {
      color: var(--red);
      font-size: 0.74rem;
      font-weight: 700;
      min-height: 18px;
      margin-bottom: 10px;
      opacity: 0;
      transition: opacity 0.2s;
    }

    #pin-error.visible {
      opacity: 1;
    }

    /* TACTILE KEYPAD */
    .keypad {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
      max-width: 280px;
      margin: 0 auto 14px;
    }

    .key-btn {
      height: 52px;
      border-radius: 14px;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.1);
      color: #fff;
      font-size: 1.25rem;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.12s ease;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .key-btn:hover {
      background: rgba(212, 175, 55, 0.14);
      border-color: rgba(212, 175, 55, 0.4);
    }

    .key-btn:active {
      transform: scale(0.94);
      background: rgba(212, 175, 55, 0.25);
    }

    .key-btn.action-key {
      font-size: 0.85rem;
      color: #aaa;
    }

    /* ADMIN DASHBOARD */
    #admin-panel {
      display: none;
      animation: cardEntrance 0.35s ease;
    }

    /* SHOP STATUS BAR */
    .status-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: rgba(0, 0, 0, 0.55);
      border: 1px solid rgba(255, 255, 255, 0.09);
      padding: 12px 14px;
      border-radius: 16px;
      margin-bottom: 16px;
      font-size: 0.8rem;
    }

    .status-indicator {
      display: flex;
      align-items: center;
      gap: 9px;
      font-weight: 800;
      letter-spacing: 0.5px;
    }

    .dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: var(--green);
      box-shadow: 0 0 10px var(--green);
      animation: pulseGreen 2s infinite;
    }

    @keyframes pulseGreen {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.6; transform: scale(1.15); }
    }

    .dot.closed {
      background: var(--red);
      box-shadow: 0 0 10px var(--red);
      animation: none;
    }

    .toggle-btn {
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.18);
      color: #fff;
      font-size: 0.7rem;
      font-weight: 700;
      padding: 6px 11px;
      border-radius: 8px;
      cursor: pointer;
      transition: 0.2s;
    }

    .toggle-btn:hover {
      background: rgba(255, 255, 255, 0.16);
    }

    /* CONTROL GRID */
    .control-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin-bottom: 16px;
    }

    .ctrl-btn {
      padding: 16px 10px;
      border-radius: 16px;
      background: rgba(0, 0, 0, 0.55);
      border: 1px solid rgba(212, 175, 55, 0.22);
      color: #fff;
      font-size: 0.78rem;
      font-weight: 700;
      cursor: pointer;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
      transition: all 0.2s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .ctrl-btn span.icon {
      font-size: 1.45rem;
    }

    .ctrl-btn span.sub-label {
      font-size: 0.62rem;
      color: #888;
      font-weight: 500;
    }

    .ctrl-btn:hover {
      background: rgba(212, 175, 55, 0.14);
      border-color: var(--gold);
      transform: translateY(-2px);
      box-shadow: 0 8px 20px rgba(0, 0, 0, 0.4);
    }

    .ctrl-btn:active {
      transform: scale(0.97);
    }

    /* PRIMARY ACTION BUTTON */
    .primary-btn {
      display: block;
      width: 100%;
      padding: 16px;
      border-radius: 14px;
      background: var(--gold-gradient);
      color: #000;
      font-size: 0.86rem;
      font-weight: 900;
      letter-spacing: 1px;
      text-transform: uppercase;
      border: none;
      cursor: pointer;
      box-shadow: 0 8px 24px rgba(212, 175, 55, 0.32);
      transition: transform 0.15s ease, box-shadow 0.15s ease;
    }

    .primary-btn:hover {
      box-shadow: 0 10px 28px rgba(212, 175, 55, 0.48);
    }

    .primary-btn:active {
      transform: scale(0.98);
    }

    .secondary-actions {
      display: flex;
      justify-content: space-between;
      margin-top: 12px;
      gap: 10px;
    }

    .sub-btn {
      flex: 1;
      padding: 11px;
      border-radius: 12px;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.1);
      color: #bbb;
      font-size: 0.72rem;
      font-weight: 600;
      cursor: pointer;
      transition: 0.2s;
    }

    .sub-btn:hover {
      color: #fff;
      background: rgba(255, 255, 255, 0.1);
      border-color: rgba(255, 255, 255, 0.25);
    }

    /* ADMIN MODAL */
    #adminModal {
      position: fixed;
      inset: 0;
      background: #080808;
      z-index: 9999;
      display: none;
      flex-direction: column;
      transform: translateY(100%);
      opacity: 0;
      transition: transform 0.32s cubic-bezier(0.22, 1, 0.36, 1), opacity 0.28s ease;
    }

    #adminModal.active {
      display: flex;
      transform: translateY(0);
      opacity: 1;
    }

    .modal-header {
      height: 58px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 16px;
      color: var(--gold);
      border-bottom: 1px solid rgba(212, 175, 55, 0.3);
      background: #0b0b0b;
      font-weight: 800;
      font-size: 0.85rem;
      letter-spacing: 1.2px;
      text-transform: uppercase;
      flex-shrink: 0;
    }

    .header-actions {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .icon-btn {
      background: rgba(255, 255, 255, 0.07);
      border: 1px solid rgba(255, 255, 255, 0.14);
      color: #fff;
      padding: 7px 11px;
      border-radius: 8px;
      font-size: 0.78rem;
      font-weight: 700;
      cursor: pointer;
      transition: 0.15s;
    }

    .icon-btn:hover {
      border-color: var(--gold);
      color: var(--gold);
    }

    .iframe-wrapper {
      position: relative;
      width: 100%;
      height: calc(100% - 58px);
      background: #0a0a0a;
    }

    /* LOADING OVERLAY FOR GAS */
    #frameLoader {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: #0a0a0a;
      color: var(--gold);
      gap: 12px;
      font-size: 0.75rem;
      font-weight: 700;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      z-index: 2;
      transition: opacity 0.25s ease;
    }

    #frameLoader.hidden {
      opacity: 0;
      pointer-events: none;
    }

    .spinner {
      width: 34px;
      height: 34px;
      border: 3px solid rgba(212, 175, 55, 0.2);
      border-top-color: var(--gold);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    #adminFrame {
      width: 100%;
      height: 100%;
      border: none;
      background: #fff;
    }
  </style>
</head>
<body>

  <!-- VIDEO BACKGROUND -->
  <video id="bg-video" autoplay muted loop playsinline preload="metadata">
    <source src="IMG_1039.MOV" type="video/mp4">
    <source src="IMG_1039.MOV" type="video/quicktime">
  </video>
  <div class="vignette"></div>

  <!-- MAIN OVERLAY -->
  <div id="overlay">
    <div class="card" id="mainCard">
      <div class="top-meta">
        <span class="admin-badge">🔐 Admin Control</span>
        <span id="liveClock">--:-- --</span>
      </div>

      <div class="crown-icon">👑</div>
      <h1>King of Fadez</h1>
      <div class="tagline">DASMARIÑAS BRANCH • COMMAND CENTER</div>

      <!-- 1. PIN LOCK SCREEN -->
      <div id="lock-screen">
        <div class="pin-dots" id="pinDots">
          <div class="pin-dot"></div>
          <div class="pin-dot"></div>
          <div class="pin-dot"></div>
          <div class="pin-dot"></div>
        </div>
        <div id="pin-error">Invalid Admin PIN. Try again.</div>

        <!-- Tactile Keypad -->
        <div class="keypad">
          <button class="key-btn" data-num="1">1</button>
          <button class="key-btn" data-num="2">2</button>
          <button class="key-btn" data-num="3">3</button>
          <button class="key-btn" data-num="4">4</button>
          <button class="key-btn" data-num="5">5</button>
          <button class="key-btn" data-num="6">6</button>
          <button class="key-btn" data-num="7">7</button>
          <button class="key-btn" data-num="8">8</button>
          <button class="key-btn" data-num="9">9</button>
          <button class="key-btn action-key" id="clearPinBtn">CLR</button>
          <button class="key-btn" data-num="0">0</button>
          <button class="key-btn action-key" id="delPinBtn">⌫</button>
        </div>
      </div>

      <!-- 2. ADMIN CONTROL PANEL -->
      <div id="admin-panel">
        <!-- Shop Status Toggle -->
        <div class="status-bar">
          <div class="status-indicator">
            <span class="dot" id="statusDot"></span>
            <span id="statusText">SHOP OPEN</span>
          </div>
          <button class="toggle-btn" id="toggleStatusBtn">Switch Status</button>
        </div>

        <!-- Quick Admin Modules -->
        <div class="control-grid">
          <button class="ctrl-btn" data-title="Live Appointments" data-page="admin" data-view="admin">
            <span class="icon">📅</span>
            <span>Bookings Queue</span>
            <span class="sub-label">Online & Pending</span>
          </button>
          <button class="ctrl-btn" data-title="Walk-In / POS Entry" data-page="admin" data-view="walkin">
            <span class="icon">✂️</span>
            <span>Walk-In / POS</span>
            <span class="sub-label">Quick Ticket</span>
          </button>
          <button class="ctrl-btn" data-title="Barber Roster & Shifts" data-page="admin" data-view="barbers">
            <span class="icon">💈</span>
            <span>Barbers & Shifts</span>
            <span class="sub-label">Lineup & Breaks</span>
          </button>
          <button class="ctrl-btn" data-title="Services & Pricing Setup" data-page="admin" data-view="settings">
            <span class="icon">⚙️</span>
            <span>Shop Setup</span>
            <span class="sub-label">Rates & Promos</span>
          </button>
        </div>

        <!-- Launch Full Admin Dashboard -->
        <button class="primary-btn" id="openFullAdmin">Open Full Admin Console</button>

        <!-- Utility Row -->
        <div class="secondary-actions">
          <button class="sub-btn" id="openClientView">👁️ Preview Client App</button>
          <button class="sub-btn" id="lockBtn">🔒 Lock Console</button>
        </div>
      </div>
    </div>
  </div>

  <!-- ADMIN MODAL -->
  <div id="adminModal">
    <div class="modal-header">
      <span id="modalTitle">Admin Console</span>
      <div class="header-actions">
        <button class="icon-btn" id="reloadFrame" title="Reload">↻ Refresh</button>
        <button class="icon-btn" id="closeModal" aria-label="Close">✕</button>
      </div>
    </div>

    <div class="iframe-wrapper">
      <div id="frameLoader">
        <div class="spinner"></div>
        <span>Syncing Command Center...</span>
      </div>
      <iframe
        id="adminFrame"
        src=""
        allow="camera; microphone; clipboard-read; clipboard-write; geolocation">
      </iframe>
    </div>
  </div>

  <script>
    // ==========================================
    // CONFIGURATION
    // ==========================================
    const ADMIN_PIN = "2026";
    const BASE_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbyBHs5chxyOcId3CqxQOkeUPAeF5SeBluT0naSKqFmPsFtJ98ctlAL5tqXcINQ57SPa/exec";
    const BRANCH = "main";

    // DOM Elements
    const mainCard = document.getElementById('mainCard');
    const lockScreen = document.getElementById('lock-screen');
    const adminPanel = document.getElementById('admin-panel');
    const pinDots = document.querySelectorAll('.pin-dot');
    const pinError = document.getElementById('pin-error');
    const adminModal = document.getElementById('adminModal');
    const adminFrame = document.getElementById('adminFrame');
    const frameLoader = document.getElementById('frameLoader');
    const modalTitle = document.getElementById('modalTitle');

    let enteredPin = "";

    // Live Clock
    function updateClock() {
      const now = new Date();
      document.getElementById('liveClock').textContent = now.toLocaleTimeString([], {
        hour: '2-digit',
        minute: '2-digit'
      });
    }
    updateClock();
    setInterval(updateClock, 10000);

    // Check Session Unlock State
    if (sessionStorage.getItem('kof_admin_unlocked') === 'true') {
      showAdminPanel();
    }

    function showAdminPanel() {
      lockScreen.style.display = 'none';
      adminPanel.style.display = 'block';
    }

    function lockAdminPanel() {
      sessionStorage.removeItem('kof_admin_unlocked');
      enteredPin = "";
      updatePinDots();
      adminPanel.style.display = 'none';
      lockScreen.style.display = 'block';
    }

    function updatePinDots(isError = false) {
      pinDots.forEach((dot, index) => {
        dot.classList.remove('filled', 'error');
        if (isError) {
          dot.classList.add('error');
        } else if (index < enteredPin.length) {
          dot.classList.add('filled');
        }
      });
    }

    function handleDigitInput(digit) {
      if (enteredPin.length >= ADMIN_PIN.length) return;
      pinError.classList.remove('visible');
      enteredPin += digit;
      updatePinDots();

      if (enteredPin.length === ADMIN_PIN.length) {
        setTimeout(verifyPin, 120);
      }
    }

    function verifyPin() {
      if (enteredPin === ADMIN_PIN) {
        sessionStorage.setItem('kof_admin_unlocked', 'true');
        showAdminPanel();
      } else {
        updatePinDots(true);
        pinError.classList.add('visible');
        mainCard.classList.remove('shake');
        void mainCard.offsetWidth; // trigger reflow
        mainCard.classList.add('shake');

        setTimeout(() => {
          enteredPin = "";
          updatePinDots();
        }, 450);
      }
    }

    // Keypad Event Listeners
    document.querySelectorAll('.key-btn[data-num]').forEach(btn => {
      btn.addEventListener('click', () => handleDigitInput(btn.dataset.num));
    });

    document.getElementById('clearPinBtn').addEventListener('click', () => {
      enteredPin = "";
      pinError.classList.remove('visible');
      updatePinDots();
    });

    document.getElementById('delPinBtn').addEventListener('click', () => {
      enteredPin = enteredPin.slice(0, -1);
      pinError.classList.remove('visible');
      updatePinDots();
    });

    // Physical Keyboard Support on Lock Screen
    document.addEventListener('keydown', (e) => {
      if (lockScreen.style.display === 'none') return;
      if (e.key >= '0' && e.key <= '9') {
        handleDigitInput(e.key);
      } else if (e.key === 'Backspace') {
        enteredPin = enteredPin.slice(0, -1);
        updatePinDots();
      } else if (e.key === 'Escape') {
        enteredPin = "";
        updatePinDots();
      }
    });

    document.getElementById('lockBtn').addEventListener('click', lockAdminPanel);

    // Shop Status Toggle (Saved Locally)
    let isShopOpen = localStorage.getItem('kof_shop_open') !== 'false';
    const statusDot = document.getElementById('statusDot');
    const statusText = document.getElementById('statusText');

    function updateStatusUI() {
      if (isShopOpen) {
        statusDot.classList.remove('closed');
        statusText.textContent = 'SHOP OPEN';
        statusText.style.color = '#2ecc71';
      } else {
        statusDot.classList.add('closed');
        statusText.textContent = 'SHOP CLOSED';
        statusText.style.color = '#e74c3c';
      }
    }
    updateStatusUI();

    document.getElementById('toggleStatusBtn').addEventListener('click', () => {
      isShopOpen = !isShopOpen;
      localStorage.setItem('kof_shop_open', isShopOpen);
      updateStatusUI();
    });

    // Clean URL Builder & Modal Launcher
    function launchRoute(title, pageParam, viewParam) {
      modalTitle.textContent = title;

      const url = new URL(BASE_SCRIPT_URL);
      url.searchParams.set('page', pageParam);
      url.searchParams.set('branch', BRANCH);
      if (viewParam) url.searchParams.set('view', viewParam);

      const targetUrl = url.toString();

      if (adminFrame.src !== targetUrl) {
        frameLoader.classList.remove('hidden');
        adminFrame.src = targetUrl;
      }

      adminModal.style.display = 'flex';
      requestAnimationFrame(() => adminModal.classList.add('active'));
    }

    adminFrame.addEventListener('load', () => {
      frameLoader.classList.add('hidden');
    });

    // Grid Buttons
    document.querySelectorAll('.ctrl-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        launchRoute(btn.dataset.title, btn.dataset.page, btn.dataset.view);
      });
    });

    // Full Admin & Client Preview Buttons
    document.getElementById('openFullAdmin').addEventListener('click', () => {
      launchRoute('Full Admin Console', 'admin', 'admin');
    });

    document.getElementById('openClientView').addEventListener('click', () => {
      launchRoute('Client Booking Preview', 'client', 'client');
    });

    // Modal Controls
    document.getElementById('reloadFrame').addEventListener('click', () => {
      frameLoader.classList.remove('hidden');
      adminFrame.src = adminFrame.src;
    });

    document.getElementById('closeModal').addEventListener('click', () => {
      adminModal.classList.remove('active');
      setTimeout(() => {
        adminModal.style.display = 'none';
      }, 320);
    });
  </script>

</body>
</html>
